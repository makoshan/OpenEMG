name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 审查实际提交的文件和历史，避免把 GitHub 临时合并提交的账户信息算进发布内容。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install C99 / Cortex-M4 toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-dev gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jsonschema scipy scikit-learn pyserial bleak h5py Pillow zstandard

      - name: Public hygiene gate (9/9 selftest + archive deep scan)
        run: |
          python scripts/check_public_hygiene.py --selftest
          python scripts/check_public_hygiene.py .

      - name: 3D model completeness & self-contained CAD gate (4/4 selftest + full repo)
        run: |
          python scripts/check_3d_completeness.py --selftest
          python scripts/check_3d_completeness.py .

      - name: JLCPCB 17-pack manufacturing gate (6/6 selftest + SHA-256 & BOM/CPL parity)
        run: |
          python scripts/check_fab_packs.py --selftest
          python scripts/check_fab_packs.py .

      - name: Hardware schematic parity & 8ch single-sided BOM verification
        run: |
          python hardware/16ch-u9-dual30/verify_interface.py --selftest
          python hardware/16ch-u9-dual30/verify_interface.py
          (cd hardware/16ch-u9-dual30 && sha256sum -c SHA256SUMS)
          python hardware/common-mainboard/schematics/check_all.py
          python hardware/16ch-c08b-round/schematics-afe/check_all.py
          python hardware/8ch-ads1298/afe-d20-8ch/schematics-8ch/check_all.py
          python hardware/2ch-ads1292/schematics/page1.py
          python hardware/8ch-ads1298/stacked-d20-8ch/verify_8ch_dnp.py

      - name: Firmware pin table & host unit tests (MCU-U9 + R4U6 + R4U6N + 16/8/2ch + ADS1292/ADS1298 drivers)
        run: |
          python firmware/c08b-bringup/tools/pins_u9.py --selftest
          python firmware/c08b-bringup/tools/pins.py hardware/common-mainboard/mainboard-r4u6n/C08B-main-R4U6N.epcb2
          python firmware/c08b-bringup/tools/pins.py hardware/common-mainboard/mainboard-r4u6/r4u6-readback.json
          python firmware/c08b-bringup/tools/pins.py hardware/common-mainboard/mainboard-r4u6/C08B-main-R4U6.epcb2
          python firmware/c08b-bringup/tools/decode_bringup.py --self-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -I firmware/c08b-bringup/common -I firmware/c08b-bringup/l432 -I firmware/c08b-bringup/nrf firmware/c08b-bringup/host_test/test_host.c -o /tmp/test_c08b_host
          /tmp/test_c08b_host
          PY=python bash firmware/xiao-ads1292-2ch/check.sh
          PY=python bash firmware/c08b-stream/check.sh
          c++ -std=c++17 -O2 -Wall -Wextra -Werror hardware/8ch-ads1298/r01-bench/firmware-f05/src/ads1298.cpp hardware/8ch-ads1298/r01-bench/firmware-f05/test_ads1298.cpp -o /tmp/test_ads1298
          /tmp/test_ads1298

      - name: EMG quality gate unit tests (170 tests)
        run: |
          python -m unittest discover -s emg_gate/tests -p "test_*.py"

      - name: Host DSP & bench analysis checks
        run: |
          PY=python bash host/check_all.sh

      - name: App frontend build & contract checks
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          YUANLI_PY: python
        run: |
          npm ci
          npm run build
          npm run check
          npm run check:gesture-library
          node --experimental-transform-types --no-warnings check-seal-game.mjs
          npm run check:filter-stream
          npm run check:missing-label
          npm run check:wear-hint
          npm run check:rewear-hint
          npm run check:multichannel
          npm run check:packaged-resources

      - name: Verify working tree stays clean after checks
        run: |
          test -z "$(git status --porcelain)"
