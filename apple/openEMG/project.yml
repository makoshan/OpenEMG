# xcodegen generate 生成 openEMG.xcodeproj（不入库）。签名团队不写进仓库，构建时传 DEVELOPMENT_TEAM。
name: openEMG
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: openEMG
targets:
  openEMG:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: ../../hardware/8ch-ads1298/r01-bench/firmware-f05/src/v12_dsp.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openemg.openemg
        SWIFT_OBJC_BRIDGING_HEADER: iOS/Bridging.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/iOS
          - $(SRCROOT)/../../hardware/8ch-ads1298/r01-bench/firmware-f05/src
        GCC_C_LANGUAGE_STANDARD: c11
        OTHER_CFLAGS: -ffp-contract=off
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 连接肌电手环，实时接收和处理多路肌电
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: openEMGWatch
  openEMGWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openemg.openemg.watchkitapp
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: org.openemg.openemg
