<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" font-family="PingFang SC, Helvetica, sans-serif"><rect width="1680" height="1188" fill="#fffdf6"/><rect x="10" y="10" width="1660" height="1168" fill="none" stroke="#333" stroke-width="2"/><text x="50" y="58" font-size="26" fill="#111" font-weight="bold">ADS1292 双通道六触点验证版（R9 板 + R7 壳）· 贴肤侧翻面视图 vs 元件面俯视图</text><text x="50" y="88" font-size="13" fill="#555">消除翻面左右镜像歧义：元件面（+x朝东右）北排 E1·E3·E2 / 南排 E4·E6·E5；翻到贴肤侧（+y朝北上，左右镜像）左→右为 E2·E3·E1 / E5·E6·E4</text><rect x="45" y="115" width="775" height="945" fill="none" stroke="#333" stroke-width="1.6"/><text x="65" y="148" font-size="18" fill="#a8322d" font-weight="bold">A  贴肤侧翻面视图（Bottom 底面朝读者，+y 北朝上，−x 西在右、+x 东在左）</text><text x="65" y="174" font-size="12" fill="#555">对应 R7 下壳底面 6 个触点开窗与《ADS1292-R7-纸样-20261111.pdf》视角：全部器件在背面，本面仅露出 6 枚沉金电极</text><rect x="130" y="225" width="603" height="511" rx="64" fill="#1c242b" stroke="#5a6875" stroke-width="3"/><text x="148" y="485" font-size="11.5" fill="#9fb0c0" font-weight="bold">← 东侧 (+x，J2 座与 XIAO USB 朝向，翻面后在左)</text><circle cx="311" cy="367" r="30" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="311" y="365" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">E2</text><text x="311" y="379" font-size="9.5" fill="#111" text-anchor="middle" font-weight="bold">Φ4</text><text x="311" y="417" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">CH1- (IN1N)</text><text x="311" y="433" font-size="11" fill="#b8c7d6" text-anchor="middle">第1排·左</text><circle cx="431" cy="367" r="22" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="431" y="365" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">E3</text><text x="431" y="379" font-size="9.5" fill="#111" text-anchor="middle" font-weight="bold">Φ3</text><text x="431" y="409" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">RLD (偏置北)</text><text x="431" y="425" font-size="11" fill="#b8c7d6" text-anchor="middle">第1排·中</text><circle cx="551" cy="367" r="30" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="551" y="365" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">E1</text><text x="551" y="379" font-size="9.5" fill="#111" text-anchor="middle" font-weight="bold">Φ4</text><text x="551" y="417" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">CH1+ (IN1P)</text><text x="551" y="433" font-size="11" fill="#b8c7d6" text-anchor="middle">第1排·右</text><circle cx="311" cy="592" r="30" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="311" y="590" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">E5</text><text x="311" y="604" font-size="9.5" fill="#111" text-anchor="middle" font-weight="bold">Φ4</text><text x="311" y="642" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">CH2- (IN2N)</text><text x="311" y="658" font-size="11" fill="#b8c7d6" text-anchor="middle">第2排·左</text><circle cx="431" cy="592" r="22" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="431" y="590" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">E6</text><text x="431" y="604" font-size="9.5" fill="#111" text-anchor="middle" font-weight="bold">Φ3</text><text x="431" y="634" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">RLD (偏置南)</text><text x="431" y="650" font-size="11" fill="#b8c7d6" text-anchor="middle">第2排·中</text><circle cx="551" cy="592" r="30" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="551" y="590" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">E4</text><text x="551" y="604" font-size="9.5" fill="#111" text-anchor="middle" font-weight="bold">Φ4</text><text x="551" y="642" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">CH2+ (IN2P)</text><text x="551" y="658" font-size="11" fill="#b8c7d6" text-anchor="middle">第2排·右</text><rect x="75" y="770" width="715" height="260" fill="#f8fafd" stroke="#b8c4d4" stroke-width="1.4"/><text x="95" y="802" font-size="15" fill="#a8322d" font-weight="bold">贴肤侧核对口诀（戴上手腕前看底面 6 个圆形沉金焊盘）：</text><text x="95" y="834" font-size="11" fill="#222">1. 东侧朝左、北排朝上：左列两颗 Φ4mm 大圆盘为负端 E2(CH1−)、E5(CH2−)；右列两颗为正端 E1(CH1+)、E4(CH2+)。</text><text x="95" y="868" font-size="11" fill="#222">2. 中间两颗 Φ3mm 辅助圆盘为偏置触点 E3(北, E3_RLD) 与 E6(南, E6_RLD)，经 R14/R16(620kΩ 0603) 汇入 NRLD 再串 R13(300kΩ)。</text><text x="95" y="902" font-size="11" fill="#222">3. 四颗采样大圆盘（Φ4.0 mm）背面无任何过孔穿入贴肤区（check_skin.py 校验 skin_zone_vias = 0，防汗液渗入内层）。</text><text x="95" y="936" font-size="11" fill="#222">4. R7 下壳底面开 6 个窗口，6 枚沉金圆焊盘（手焊镀金电极帽）凸出贴肤；切勿把第二排右边的 E4 (CH2+) 误记成 E5！</text><rect x="845" y="115" width="790" height="945" fill="none" stroke="#333" stroke-width="1.6"/><text x="865" y="148" font-size="18" fill="#1d3f9a" font-weight="bold">B  元件面俯视图（Top 正面朝读者，+y 北朝上，−x 西在左、+x 东在右）</text><text x="865" y="174" font-size="12" fill="#555">对应 KiCad PCB 正面（47 颗贴片）与离体上电探针测量视角：U1 在西侧 (-8,+0.5)、J2 在东南 (+12,-11.4) 朝南、TP1 在中北、TP2/3/8 在中南</text><rect x="935" y="225" width="603" height="511" rx="64" fill="#1c242b" stroke="#5a6875" stroke-width="3"/><text x="1520" y="485" font-size="11.5" fill="#9fb0c0" text-anchor="end" font-weight="bold">东侧 (+x，XIAO USB 朝东) →</text><circle cx="1116" cy="367" r="30" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1116" y="329" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E1 (CH1+)</text><circle cx="1236" cy="367" r="22" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1236" y="337" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E3 (RLD)</text><circle cx="1356" cy="367" r="30" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1356" y="329" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E2 (CH1-)</text><circle cx="1116" cy="592" r="30" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1116" y="554" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E4 (CH2+)</text><circle cx="1236" cy="592" r="22" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1236" y="562" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E6 (RLD)</text><circle cx="1356" cy="592" r="30" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1356" y="554" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E5 (CH2-)</text><rect x="1078" y="434" width="76" height="76" fill="#2c3945" stroke="#deb05e" stroke-width="2"/><circle cx="1088" cy="444" r="4" fill="#ff5555"/><text x="1116" y="476" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="bold">U1 ADS1292</text><rect x="1361" y="636" width="110" height="30" fill="#e8eef5" stroke="#1d3f9a" stroke-width="2"/><text x="1416" y="655" font-size="10.5" fill="#1d3f9a" text-anchor="middle" font-weight="bold">J2 (20P 朝南→P44e)</text><circle cx="1204" cy="375" r="6.5" fill="#7ce0ff" stroke="#111" stroke-width="1.5"/><text x="1204" y="397" font-size="10" fill="#7ce0ff" text-anchor="middle" font-weight="bold">TP1 (AVDD 3V)</text><circle cx="1219" cy="609" r="6.5" fill="#7ce0ff" stroke="#111" stroke-width="1.5"/><text x="1219" y="597" font-size="10" fill="#7ce0ff" text-anchor="start" font-weight="bold">TP2 (3V3)</text><circle cx="1191" cy="637" r="6.5" fill="#9eff9e" stroke="#111" stroke-width="1.5"/><text x="1191" y="655" font-size="10" fill="#9eff9e" text-anchor="start" font-weight="bold">TP3 (GND)</text><circle cx="1152" cy="687" r="6.5" fill="#ff7b7b" stroke="#111" stroke-width="1.5"/><text x="1152" y="705" font-size="10" fill="#ff7b7b" text-anchor="end" font-weight="bold">TP8 (RESET_N)</text><rect x="865" y="770" width="745" height="260" fill="#f8fafd" stroke="#b8c4d4" stroke-width="1.4"/><text x="885" y="802" font-size="15" fill="#1d3f9a" font-weight="bold">元件面装机与台架探针核对要点：</text><text x="885" y="834" font-size="11" fill="#222">1. 元件面全部 47 颗贴片位于正面（Top，含 J2），底面（Bottom）0 器件，仅 6 枚 Φ4/Φ3mm 沉金圆焊盘；四角 H1–H4 为 Φ1.7mm 孔。</text><text x="885" y="868" font-size="11" fill="#222">2. 东南侧 J2（FH34SRJ-20S，坐标 112.0, 111.4mm，朝南）经 20P 排线连上层 P44e J1（脚 n 对 21−n）；XIAO 焊在 P44e 顶面。</text><text x="885" y="902" font-size="11" fill="#222">3. 实板测点：TP1(AVDD 3.0V) 在中北(97.9, 93.0)；TP2(3V3, 98.9, 108.6)、TP3(GND, 97.0, 110.5)、TP8(RESET_N, 94.4, 113.8) 在中南。</text><text x="885" y="936" font-size="11" fill="#222">4. 虚线圆标出底面 E1–E6 在元件面的正投影：北排左→右为 E1(CH1+)·E3(RLD)·E2(CH1−)，南排左→右为 E4(CH2+)·E6(RLD)·E5(CH2−)。</text><text x="40" y="1125" font-size="22" fill="#111" text-anchor="start" font-weight="bold">ADS1292 双通道验证版 · 贴肤侧翻面视图与元件面测点分布图</text><text x="40" y="1155" font-size="12" fill="#555" text-anchor="start" font-weight="normal">左：贴肤侧翻面（E2·E3·E1 / E5·E6·E4）；右：元件面俯视（E1·E3·E2 / E4·E6·E5 + U1 + J2 + TP1/2/3/8）</text><rect x="1180" y="1094" width="470" height="84" fill="none" stroke="#333" stroke-width="1.4"/><polyline points="1180,1122 1650,1122" fill="none" stroke="#333" stroke-width="1"/><polyline points="1180,1150 1650,1150" fill="none" stroke="#333" stroke-width="1"/><polyline points="1260,1094 1260,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1480,1094 1480,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1550,1094 1550,1178" fill="none" stroke="#333" stroke-width="1"/><text x="1190" y="1113" font-size="12" fill="#333" text-anchor="start">图名</text><text x="1270" y="1113" font-size="12" fill="#111" text-anchor="start">ADS1292 双通道 · 贴肤翻面与元件面</text><text x="1490" y="1113" font-size="12" fill="#333" text-anchor="start">版本</text><text x="1560" y="1113" font-size="12" fill="#111" text-anchor="start">R9 六触点定稿</text><text x="1190" y="1141" font-size="12" fill="#333" text-anchor="start">图页</text><text x="1270" y="1141" font-size="12" fill="#111" text-anchor="start">附图 1 / 1</text><text x="1490" y="1141" font-size="12" fill="#333" text-anchor="start">日期</text><text x="1560" y="1141" font-size="12" fill="#111" text-anchor="start">2026-11-15</text><text x="1190" y="1169" font-size="12" fill="#333" text-anchor="start">用途</text><text x="1270" y="1169" font-size="12" fill="#111" text-anchor="start">六触点极性与上电探针定位</text><text x="1490" y="1169" font-size="12" fill="#333" text-anchor="start">尺寸</text><text x="1560" y="1169" font-size="12" fill="#111" text-anchor="start">A3</text></svg>