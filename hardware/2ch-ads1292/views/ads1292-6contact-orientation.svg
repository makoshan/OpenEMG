<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" font-family="PingFang SC, Helvetica, sans-serif"><rect width="1680" height="1188" fill="#fffdf6"/><rect x="10" y="10" width="1660" height="1168" fill="none" stroke="#333" stroke-width="2"/><text x="50" y="58" font-size="26" fill="#111" font-weight="bold">ADS1292 双通道六触点验证版（R9 板 + R7 壳）· 贴肤侧翻面视图 vs 元件面俯视图</text><text x="50" y="88" font-size="13" fill="#555">消除翻面左右镜像歧义：元件面（+x朝东右）北排 E1·E3·E2 / 南排 E4·E6·E5；翻到贴肤侧（+y朝北上，左右镜像）左→右为 E2·E3·E1 / E5·E6·E4</text><rect x="45" y="115" width="775" height="945" fill="none" stroke="#333" stroke-width="1.6"/><text x="65" y="148" font-size="18" fill="#a8322d" font-weight="bold">A  贴肤侧翻面视图（Bottom 底面朝读者，+y 北朝上，−x 西在右、+x 东在左）</text><text x="65" y="174" font-size="12" fill="#555">对应 R7 下壳底面 6 个触点开窗与《ADS1292-R7-纸样-20261111.pdf》视角：全部器件在背面，本面仅露出 6 枚沉金电极</text><rect x="130" y="225" width="603" height="511" rx="64" fill="#1c242b" stroke="#5a6875" stroke-width="3"/><text x="148" y="485" font-size="11.5" fill="#9fb0c0" font-weight="bold">← 东侧 (+x，J2 座与 XIAO USB 朝向，翻面后在左)</text><rect x="281" y="322" width="60" height="90" rx="8" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="311" y="363" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">E2</text><text x="311" y="381" font-size="10" fill="#111" text-anchor="middle" font-weight="bold">4×6</text><text x="311" y="432" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">CH1- (IN1N)</text><text x="311" y="448" font-size="11" fill="#b8c7d6" text-anchor="middle">第1排·左</text><rect x="409" y="322" width="45" height="90" rx="8" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="431" y="363" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">E3</text><text x="431" y="381" font-size="10" fill="#111" text-anchor="middle" font-weight="bold">3×6</text><text x="431" y="432" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">RLD (偏置北)</text><text x="431" y="448" font-size="11" fill="#b8c7d6" text-anchor="middle">第1排·中</text><rect x="521" y="322" width="60" height="90" rx="8" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="551" y="363" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">E1</text><text x="551" y="381" font-size="10" fill="#111" text-anchor="middle" font-weight="bold">4×6</text><text x="551" y="432" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">CH1+ (IN1P)</text><text x="551" y="448" font-size="11" fill="#b8c7d6" text-anchor="middle">第1排·右</text><rect x="281" y="547" width="60" height="90" rx="8" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="311" y="588" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">E5</text><text x="311" y="606" font-size="10" fill="#111" text-anchor="middle" font-weight="bold">4×6</text><text x="311" y="657" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">CH2- (IN2N)</text><text x="311" y="673" font-size="11" fill="#b8c7d6" text-anchor="middle">第2排·左</text><rect x="409" y="547" width="45" height="90" rx="8" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="431" y="588" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">E6</text><text x="431" y="606" font-size="10" fill="#111" text-anchor="middle" font-weight="bold">3×6</text><text x="431" y="657" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">RLD (偏置南)</text><text x="431" y="673" font-size="11" fill="#b8c7d6" text-anchor="middle">第2排·中</text><rect x="521" y="547" width="60" height="90" rx="8" fill="#deb05e" stroke="#fff" stroke-width="2"/><text x="551" y="588" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">E4</text><text x="551" y="606" font-size="10" fill="#111" text-anchor="middle" font-weight="bold">4×6</text><text x="551" y="657" font-size="12" fill="#ffd27d" text-anchor="middle" font-weight="bold">CH2+ (IN2P)</text><text x="551" y="673" font-size="11" fill="#b8c7d6" text-anchor="middle">第2排·右</text><rect x="75" y="770" width="715" height="260" fill="#f8fafd" stroke="#b8c4d4" stroke-width="1.4"/><text x="95" y="802" font-size="15" fill="#a8322d" font-weight="bold">贴肤侧核对口诀（戴上手腕前看底面 6 个金片）：</text><text x="95" y="834" font-size="11.5" fill="#222">1. 把东侧（J2 座与 XIAO USB 口一侧）朝左、北排朝上：左列两颗大金片是负端 E2 (CH1−)、E5 (CH2−)；右列两颗大金片是正端 E1 (CH1+)、E4 (CH2+)。</text><text x="95" y="868" font-size="11.5" fill="#222">2. 中间两颗窄金片（3×6 mm）是右腿驱动偏置触点 E3（北）与 E6（南），分别经 R14 (620kΩ)、R16 (620kΩ) 汇入 NRLD，再串 R13 (300kΩ)。</text><text x="95" y="902" font-size="11.5" fill="#222">3. 四颗采样大金片（4×6 mm）背面无任何过孔穿入贴肤区（check_skin.py 校验 skin_zone_vias = 0，防汗液渗入内层）。</text><text x="95" y="936" font-size="11.5" fill="#222">4. R7 下壳底面开 6 个矩形斜切窗，6 枚沉金焊盘与壳底齐平贴肤；切勿把第二排右边的 E4 (CH2+) 误记成 E5！</text><rect x="845" y="115" width="790" height="945" fill="none" stroke="#333" stroke-width="1.6"/><text x="865" y="148" font-size="18" fill="#1d3f9a" font-weight="bold">B  元件面俯视图（Top 正面朝读者，+y 北朝上，−x 西在左、+x 东在右）</text><text x="865" y="174" font-size="12" fill="#555">对应 KiCad PCB 正面与离体上电探针测量视角：全部贴片器件、U1 ADS1292、J2 20P 座与 TP1/2/3/8 均在本面</text><rect x="935" y="225" width="603" height="511" rx="64" fill="#1c242b" stroke="#5a6875" stroke-width="3"/><text x="1520" y="485" font-size="11.5" fill="#9fb0c0" text-anchor="end" font-weight="bold">东侧 (+x，XIAO USB 朝东) →</text><rect x="1086" y="322" width="60" height="90" rx="6" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1116" y="315" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E1 (CH1+)</text><rect x="1206" y="322" width="60" height="90" rx="6" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1236" y="315" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E3 (RLD)</text><rect x="1326" y="322" width="60" height="90" rx="6" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1356" y="315" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E2 (CH1-)</text><rect x="1086" y="547" width="60" height="90" rx="6" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1116" y="540" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E4 (CH2+)</text><rect x="1206" y="547" width="60" height="90" rx="6" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1236" y="540" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E6 (RLD)</text><rect x="1326" y="547" width="60" height="90" rx="6" fill="none" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1356" y="540" font-size="11" fill="#ffd27d" text-anchor="middle" font-weight="bold">E5 (CH2-)</text><rect x="1194" y="438" width="84" height="84" fill="#2c3945" stroke="#deb05e" stroke-width="2"/><circle cx="1204" cy="448" r="4" fill="#ff5555"/><text x="1236" y="484" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">U1 ADS1292</text><rect x="1467" y="372" width="32" height="110" fill="#e8eef5" stroke="#1d3f9a" stroke-width="2"/><text x="1459" y="427" font-size="11" fill="#7ce0ff" text-anchor="end" font-weight="bold">J2 (20P→P44e)</text><circle cx="1341" cy="360" r="7" fill="#ff7b7b" stroke="#111" stroke-width="1.5"/><text x="1341" y="380" font-size="10" fill="#ff7b7b" text-anchor="middle" font-weight="bold">TP8 (RESET_N)</text><circle cx="1438" cy="360" r="7" fill="#7ce0ff" stroke="#111" stroke-width="1.5"/><text x="1438" y="348" font-size="10" fill="#7ce0ff" text-anchor="middle" font-weight="bold">TP1 (AVDD 3V)</text><circle cx="1483" cy="360" r="7" fill="#7ce0ff" stroke="#111" stroke-width="1.5"/><text x="1483" y="380" font-size="10" fill="#7ce0ff" text-anchor="middle" font-weight="bold">TP2 (3V3)</text><circle cx="1483" cy="600" r="7" fill="#9eff9e" stroke="#111" stroke-width="1.5"/><text x="1483" y="620" font-size="10" fill="#9eff9e" text-anchor="middle" font-weight="bold">TP3 (GND)</text><rect x="865" y="770" width="745" height="260" fill="#f8fafd" stroke="#b8c4d4" stroke-width="1.4"/><text x="885" y="802" font-size="15" fill="#1d3f9a" font-weight="bold">元件面装机与台架探针核对要点：</text><text x="885" y="834" font-size="11.5" fill="#222">1. 元件面全部 45 颗贴片位于正面（Top），底面（Bottom）0 器件，仅 6 枚贴肤沉金焊盘；四角的 H1–H4 为 Φ1.7mm 装壳孔。</text><text x="885" y="868" font-size="11.5" fill="#222">2. 东北侧 J2（FH34SRJ-20S-0.5SH）经 0.5mm 20P 排线连上层 P44e 转接板 J1（脚 n 对 21−n）；XIAO 焊在 P44e 顶面，USB 口朝东。</text><text x="885" y="902" font-size="11.5" fill="#222">3. 上电测点集中在东北与东南角：TP2 测 3V3 (3.30V)、TP1 测 AVDD (3.00V)、TP8 测 ADS_RESET_N、TP3 为公共地 GND 基准。</text><text x="885" y="936" font-size="11.5" fill="#222">4. 虚线框标出底面 E1–E6 在元件面的正投影位置：北排左→右为 E1(CH1+)·E3(RLD)·E2(CH1−)，南排左→右为 E4(CH2+)·E6(RLD)·E5(CH2−)。</text><text x="40" y="1125" font-size="22" fill="#111" text-anchor="start" font-weight="bold">ADS1292 双通道验证版 · 贴肤侧翻面视图与元件面测点分布图</text><text x="40" y="1155" font-size="12" fill="#555" text-anchor="start" font-weight="normal">左：贴肤侧翻面（E2·E3·E1 / E5·E6·E4）；右：元件面俯视（E1·E3·E2 / E4·E6·E5 + U1 + J2 + TP1/2/3/8）</text><rect x="1180" y="1094" width="470" height="84" fill="none" stroke="#333" stroke-width="1.4"/><polyline points="1180,1122 1650,1122" fill="none" stroke="#333" stroke-width="1"/><polyline points="1180,1150 1650,1150" fill="none" stroke="#333" stroke-width="1"/><polyline points="1260,1094 1260,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1480,1094 1480,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1550,1094 1550,1178" fill="none" stroke="#333" stroke-width="1"/><text x="1190" y="1113" font-size="12" fill="#333" text-anchor="start">图名</text><text x="1270" y="1113" font-size="12" fill="#111" text-anchor="start">ADS1292 双通道 · 贴肤翻面与元件面</text><text x="1490" y="1113" font-size="12" fill="#333" text-anchor="start">版本</text><text x="1560" y="1113" font-size="12" fill="#111" text-anchor="start">R9 六触点定稿</text><text x="1190" y="1141" font-size="12" fill="#333" text-anchor="start">图页</text><text x="1270" y="1141" font-size="12" fill="#111" text-anchor="start">附图 1 / 1</text><text x="1490" y="1141" font-size="12" fill="#333" text-anchor="start">日期</text><text x="1560" y="1141" font-size="12" fill="#111" text-anchor="start">2026-11-15</text><text x="1190" y="1169" font-size="12" fill="#333" text-anchor="start">用途</text><text x="1270" y="1169" font-size="12" fill="#111" text-anchor="start">六触点极性与上电探针定位</text><text x="1490" y="1169" font-size="12" fill="#333" text-anchor="start">尺寸</text><text x="1560" y="1169" font-size="12" fill="#111" text-anchor="start">A3</text></svg>