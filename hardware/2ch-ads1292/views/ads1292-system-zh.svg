<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" font-family="PingFang SC, Helvetica, sans-serif"><rect width="1680" height="1188" fill="#fffdf6"/><rect x="10" y="10" width="1660" height="1168" fill="none" stroke="#333" stroke-width="2"/><text x="50" y="62" font-size="28" fill="#111" font-weight="bold">OpenEMG 2 通道六触点验证版（ADS1292 R9）· 整机框图（P1）</text><text x="50" y="92" font-size="14" fill="#555">无需外部电极软板：PCB 底面直出 6 枚沉金贴肤触点（大—辅—大 × 2 排）→ 两级 1MΩ/620kΩ+300kΩ 保护 → ADS1292 → 20P 排线 → P44e + XIAO nRF52840</text><rect x="45" y="145" width="285" height="220" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="187" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">① 盒底 6 枚贴肤触点 (E1–E6)</text><text x="187" y="201" font-size="12" fill="#333" text-anchor="middle">PCB 底面 4×6mm / 3×6mm 裸沉金焊盘</text><text x="187" y="223" font-size="12" fill="#333" text-anchor="middle">北排：E1(CH1+) · E3(RLD) · E2(CH1−)</text><text x="187" y="245" font-size="12" fill="#333" text-anchor="middle">南排：E4(CH2+) · E6(RLD) · E5(CH2−)</text><text x="187" y="267" font-size="12" fill="#333" text-anchor="middle">经 R7 外壳底面 6 个窗口凸出贴肤</text><text x="187" y="289" font-size="12" fill="#333" text-anchor="middle">免外部 FPC 表带，装盒即戴</text><polyline points="330,255 415,255" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="415,255 405,250 405,260" fill="#1f8a3a"/><text x="372" y="245" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">4 采样 + 2 偏置</text><text x="372" y="273" font-size="11" fill="#555" text-anchor="middle">底面过孔入正面</text><rect x="415" y="145" width="305" height="220" fill="#fffdf4" stroke="#a8322d" stroke-width="1.8"/><text x="567" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">② 两级高阻限流与 ESD 保护</text><text x="567" y="201" font-size="12" fill="#333" text-anchor="middle">采样腿 E1/E2/E4/E5（每腿 2.0 MΩ）：</text><text x="567" y="223" font-size="12" fill="#333" text-anchor="middle">1MΩ (R1/3/5/7) → ESD501 → 1MΩ (R2/4/6/8)</text><text x="567" y="245" font-size="12" fill="#333" text-anchor="middle">偏置腿 E3/E6（双点并联 610 kΩ）：</text><text x="567" y="267" font-size="12" fill="#333" text-anchor="middle">E3 620k(R14) + E6 620k(R16) 汇 NRLD</text><text x="567" y="289" font-size="12" fill="#333" text-anchor="middle">再经 R13 (300 kΩ) 接 U1.30 RLDOUT</text><polyline points="720,255 805,255" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="805,255 795,250 795,260" fill="#1f8a3a"/><text x="762" y="245" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">IN1± / IN2± / RLD</text><text x="762" y="273" font-size="11" fill="#555" text-anchor="middle">C4/C5 4.7nF 滤波</text><rect x="805" y="145" width="290" height="220" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="950" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">③ U1 ADS1292IPBSR 采集</text><text x="950" y="201" font-size="12" fill="#333" text-anchor="middle">2 路 24-bit ΔΣ ADC（TQFP-32）</text><text x="950" y="223" font-size="12" fill="#333" text-anchor="middle">CLKSEL=1（接 DVDD）用内部振荡器</text><text x="950" y="245" font-size="12" fill="#333" text-anchor="middle">VREFP 内部 2.42V 基准（C6/C7）</text><text x="950" y="267" font-size="12" fill="#333" text-anchor="middle">RLD 内部 AVDD/2 参考（C3 1.5nF∥R15 1M）</text><text x="950" y="289" font-size="12" fill="#333" text-anchor="middle">IN3P/IN3N 接 AVDD（31/32 脚）</text><polyline points="1095,255 1185,255" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="1185,255 1175,250 1175,260" fill="#1f8a3a"/><text x="1140" y="245" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">J2 (20P) ↔ P44e J1</text><text x="1140" y="273" font-size="11" fill="#555" text-anchor="middle">脚 n ↔ 21−n</text><rect x="1185" y="145" width="255" height="220" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="1312" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">④ P44e + XIAO nRF52840</text><text x="1312" y="201" font-size="12" fill="#333" text-anchor="middle">0.8mm 转接板 P44e 焊 XIAO Sense</text><text x="1312" y="223" font-size="12" fill="#333" text-anchor="middle">SPI 读 2 路 500 SPS + 板载 IMU</text><text x="1312" y="245" font-size="12" fill="#333" text-anchor="middle">电池焊 XIAO 背面 BAT+/BAT-</text><text x="1312" y="267" font-size="12" fill="#333" text-anchor="middle">XIAO 5V 经排线脚2 → 触发 Q1 互锁</text><text x="1312" y="289" font-size="12" fill="#333" text-anchor="middle">详见 P3 全图 C/D 框</text><polyline points="1440,255 1500,255" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="1500,255 1490,250 1490,260" fill="#1f8a3a"/><text x="1470" y="245" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">BLE / 台架</text><text x="1470" y="273" font-size="11" fill="#555" text-anchor="middle">CH1–CH2</text><rect x="1500" y="145" width="140" height="220" fill="#fffdf4" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4"/><text x="1570" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">⑤ 桌面软件</text><text x="1570" y="201" font-size="12" fill="#333" text-anchor="middle">OpenEMG App</text><text x="1570" y="223" font-size="12" fill="#333" text-anchor="middle">2 路实时波形</text><text x="1570" y="245" font-size="12" fill="#333" text-anchor="middle">500 SPS 帧流</text><text x="1570" y="267" font-size="12" fill="#333" text-anchor="middle">单故障 ≤5.4µA</text><text x="1570" y="289" font-size="12" fill="#333" text-anchor="middle">R7 外壳装配</text><rect x="45" y="410" width="785" height="640" fill="none" stroke="#4a4a4a" stroke-width="1.6"/><text x="65" y="444" font-size="19" fill="#111" font-weight="bold">A  3 页原理图结构与六触点贴肤侧翻面对照（消除左右镜像歧义）</text><polyline points="60,456 815,456" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="482" font-size="12" fill="#111" font-weight="bold">页码</text><text x="155" y="482" font-size="12" fill="#1d3f9a" font-weight="bold">图页标题</text><text x="315" y="482" font-size="11" fill="#222" font-weight="bold">涵盖内容与核对要点</text><polyline points="60,498 815,498" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="524" font-size="12" fill="#111" font-weight="normal">P1 (1/3)</text><text x="155" y="524" font-size="12" fill="#1d3f9a" font-weight="normal">01.01 整机框图</text><text x="315" y="524" font-size="11" fill="#222" font-weight="normal">E1–E6 六触点 → 两级限流保护 → ADS1292 → J2 20P 排线 → P44e + XIAO nRF52840 → 桌面软件</text><polyline points="60,540 815,540" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="566" font-size="12" fill="#111" font-weight="normal">P2 (2/3)</text><text x="155" y="566" font-size="12" fill="#1d3f9a" font-weight="normal">01.02 电源树与测点</text><text x="315" y="566" font-size="11" fill="#222" font-weight="normal">XIAO 3V3 → L1 磁珠 DVDD + U3 TPS7A2030 AVDD 3.0V；XIAO_5V → R32/R25 → Q1 拉低 ADS_RESET_N 互锁</text><polyline points="60,582 815,582" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="608" font-size="12" fill="#111" font-weight="normal">P3 (3/3)</text><text x="155" y="608" font-size="12" fill="#1d3f9a" font-weight="normal">01.03 采集与接口详图</text><text x="315" y="608" font-size="11" fill="#222" font-weight="normal">A框六触点保护、B框 U1 ADS1292、C框 J2 20P 接口、D框模拟电源与互锁、E框 47k 下拉+33R、F框去耦、G框测点</text><text x="65" y="665" font-size="16" fill="#a8322d" font-weight="bold">六触点坐标与视角对照表（以板心 (100,100) 为原点，+x 朝东 USB 侧，+y 朝北）</text><polyline points="60,674 815,674" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="65" y="702" font-size="10" fill="#111" font-weight="bold">触点位号</text><text x="130" y="702" font-size="10" fill="#111" font-weight="bold">电气通道</text><text x="235" y="702" font-size="10" fill="#111" font-weight="bold">板心相对坐标 (dx, dy)</text><text x="375" y="702" font-size="10" fill="#111" font-weight="bold">元件面俯视位置 (+x在右)</text><text x="515" y="702" font-size="10" fill="#111" font-weight="bold">贴肤侧翻面位置 (+y朝上,左右镜像)</text><text x="665" y="702" font-size="10" fill="#111" font-weight="bold">保护支路（贴肤 → 芯片）</text><polyline points="60,718 815,718" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="65" y="746" font-size="10" fill="#a8322d" font-weight="normal">E1</text><text x="130" y="746" font-size="10" fill="#a8322d" font-weight="normal">CH1+ (IN1P)</text><text x="235" y="746" font-size="10" fill="#222" font-weight="normal">(-8.0, +7.5) mm</text><text x="375" y="746" font-size="10" fill="#222" font-weight="normal">北排 · 左（西）</text><text x="515" y="746" font-size="10" fill="#222" font-weight="normal">第 1 排 · 右</text><text x="665" y="746" font-size="10" fill="#222" font-weight="normal">E1 → R1(1M) → D1(ESD) → R2(1M) → U1.4</text><polyline points="60,762 815,762" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="65" y="790" font-size="10" fill="#a8322d" font-weight="normal">E3</text><text x="130" y="790" font-size="10" fill="#a8322d" font-weight="normal">RLD (偏置北)</text><text x="235" y="790" font-size="10" fill="#222" font-weight="normal">( 0.0, +7.5) mm</text><text x="375" y="790" font-size="10" fill="#222" font-weight="normal">北排 · 中</text><text x="515" y="790" font-size="10" fill="#222" font-weight="normal">第 1 排 · 中</text><text x="665" y="790" font-size="10" fill="#222" font-weight="normal">E3 → R14(620k) → NRLD(D3) → R13(300k) → U1.30</text><polyline points="60,806 815,806" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="65" y="834" font-size="10" fill="#a8322d" font-weight="normal">E2</text><text x="130" y="834" font-size="10" fill="#a8322d" font-weight="normal">CH1- (IN1N)</text><text x="235" y="834" font-size="10" fill="#222" font-weight="normal">(+8.0, +7.5) mm</text><text x="375" y="834" font-size="10" fill="#222" font-weight="normal">北排 · 右（东）</text><text x="515" y="834" font-size="10" fill="#222" font-weight="normal">第 1 排 · 左</text><text x="665" y="834" font-size="10" fill="#222" font-weight="normal">E2 → R3(1M) → D2(ESD) → R4(1M) → U1.3</text><polyline points="60,850 815,850" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="65" y="878" font-size="10" fill="#a8322d" font-weight="normal">E4</text><text x="130" y="878" font-size="10" fill="#a8322d" font-weight="normal">CH2+ (IN2P)</text><text x="235" y="878" font-size="10" fill="#222" font-weight="normal">(-8.0, -7.5) mm</text><text x="375" y="878" font-size="10" fill="#222" font-weight="normal">南排 · 左（西）</text><text x="515" y="878" font-size="10" fill="#222" font-weight="normal">第 2 排 · 右</text><text x="665" y="878" font-size="10" fill="#222" font-weight="normal">E4 → R5(1M) → D4(ESD) → R6(1M) → U1.6</text><polyline points="60,894 815,894" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="65" y="922" font-size="10" fill="#a8322d" font-weight="normal">E6</text><text x="130" y="922" font-size="10" fill="#a8322d" font-weight="normal">RLD (偏置南)</text><text x="235" y="922" font-size="10" fill="#222" font-weight="normal">( 0.0, -7.5) mm</text><text x="375" y="922" font-size="10" fill="#222" font-weight="normal">南排 · 中</text><text x="515" y="922" font-size="10" fill="#222" font-weight="normal">第 2 排 · 中</text><text x="665" y="922" font-size="10" fill="#222" font-weight="normal">E6 → R16(620k) → NRLD(D3) → R13(300k) → U1.30</text><polyline points="60,938 815,938" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="65" y="966" font-size="10" fill="#a8322d" font-weight="normal">E5</text><text x="130" y="966" font-size="10" fill="#a8322d" font-weight="normal">CH2- (IN2N)</text><text x="235" y="966" font-size="10" fill="#222" font-weight="normal">(+8.0, -7.5) mm</text><text x="375" y="966" font-size="10" fill="#222" font-weight="normal">南排 · 右（东）</text><text x="515" y="966" font-size="10" fill="#222" font-weight="normal">第 2 排 · 左</text><text x="665" y="966" font-size="10" fill="#222" font-weight="normal">E5 → R7(1M) → D5(ESD) → R8(1M) → U1.5</text><text x="65" y="1025" font-size="11" fill="#a8322d" font-weight="bold">★ 勘误强调：无论在元件面还是贴肤翻面，E4 恒接 IN2P (CH2+)、E5 恒接 IN2N (CH2−)，与第一排 E1(CH1+)/E2(CH1−) 极性方向完全同向！</text><rect x="855" y="410" width="780" height="640" fill="none" stroke="#4a4a4a" stroke-width="1.6"/><text x="875" y="444" font-size="19" fill="#111" font-weight="bold">B  单故障电流核算、J2 ↔ P44e 排线映射与首板不贴（DNP）清单</text><text x="875" y="488" font-size="13" fill="#1d3f9a" font-weight="bold">1. 单故障安全核算（IEC 60601-1 限值 10 µA d.c.）：</text><text x="890" y="512" font-size="12" fill="#222">• 采样支路（E1/E2/E4/E5）：每腿两颗独立 0402 1MΩ 电阻（R1+R2 等）串</text><text x="890" y="532" font-size="12" fill="#222">联，总阻值 2.0 MΩ；即使单颗电阻短路（单一故障），剩余 1.0 MΩ 在 3.3V 下最大</text><text x="890" y="552" font-size="12" fill="#222">电流仅 3.3 µA。</text><text x="890" y="574" font-size="12" fill="#222">• 偏置支路（E3/E6）：RLDOUT 经 R13 (300kΩ) 到 NRLD，再分 R14</text><text x="890" y="594" font-size="12" fill="#222"> (620kΩ → E3) 与 R16 (620kΩ → E6)；单触点串阻 920 kΩ（3.</text><text x="890" y="614" font-size="12" fill="#222">3V 下 3.59 µA），双触点同时贴肤等效 610 kΩ（3.3V 下 5.41 µA ≤ </text><text x="890" y="634" font-size="12" fill="#222">10 µA）。</text><text x="875" y="668" font-size="13" fill="#1d3f9a" font-weight="bold">2. J2 (20P) ↔ P44e 转接板 J1 排线翻面关系（脚 n ↔ 脚 21−n）：</text><text x="890" y="692" font-size="12" fill="#222">• J2.1 (GND) ↔ J1.20 · J2.2 (XIAO_5V) ↔ J1.19 · </text><text x="890" y="712" font-size="12" fill="#222">J2.3 (AVDD_SENSE) ↔ J1.18 (A3/D3)</text><text x="890" y="734" font-size="12" fill="#222">• J2.5 (ADS_DIN) ↔ J1.16 (D10 MOSI) · J2.6 (MCU_</text><text x="890" y="754" font-size="12" fill="#222">PWDN) ↔ J1.15 (A2/D2) · J2.9 (ADS_START) ↔ J1.12</text><text x="890" y="774" font-size="12" fill="#222"> (A1/D1)</text><text x="890" y="796" font-size="12" fill="#222">• J2.10 (ADS_CS_N) ↔ J1.11 (A0/D0) · J2.11 (MCU_</text><text x="890" y="816" font-size="12" fill="#222">SCLK) ↔ J1.10 (D8 SCK) · J2.15 (ADS_DOUT) ↔ J1.6</text><text x="890" y="836" font-size="12" fill="#222"> (D9 MISO)</text><text x="890" y="858" font-size="12" fill="#222">• J2.17 (ADS_DRDY_N) ↔ J1.4 (D7) · J2.19/20 (3V3</text><text x="890" y="878" font-size="12" fill="#222">) ↔ J1.2/1 (3V3) · J2.4/7/8/16/18 空脚 NC</text><text x="875" y="912" font-size="13" fill="#1d3f9a" font-weight="bold">3. 首板贴片与灰字不贴（DNP）状态说明：</text><text x="890" y="936" font-size="12" fill="#222">• 原理图 P3 中 R1–R8、R13、R14、R16、R23 标灰字「不贴」代表首版 SMT</text><text x="890" y="956" font-size="12" fill="#222"> 基础贴片候选留空位，由台架实测或手焊贴装核对；上人体前必须确认 R1–R8 (1MΩ)、R13</text><text x="890" y="976" font-size="12" fill="#222"> (300kΩ)、R14/R16 (620kΩ) 与 R32 (0R 互锁) 已全数焊妥并实测阻</text><text x="890" y="996" font-size="12" fill="#222">值合格！</text><text x="40" y="1125" font-size="22" fill="#111" text-anchor="start" font-weight="bold">ADS1292 双通道六触点验证版 · 整机框图与贴肤翻面对照（P1）</text><text x="40" y="1155" font-size="12" fill="#555" text-anchor="start" font-weight="normal">PCB 底面 6 枚沉金电极（E1–E6）→ 两级限流保护 → ADS1292 → 20P 排线 → P44e + XIAO nRF52840 Sense</text><rect x="1180" y="1094" width="470" height="84" fill="none" stroke="#333" stroke-width="1.4"/><polyline points="1180,1122 1650,1122" fill="none" stroke="#333" stroke-width="1"/><polyline points="1180,1150 1650,1150" fill="none" stroke="#333" stroke-width="1"/><polyline points="1260,1094 1260,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1480,1094 1480,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1550,1094 1550,1178" fill="none" stroke="#333" stroke-width="1"/><text x="1190" y="1113" font-size="12" fill="#333" text-anchor="start">图名</text><text x="1270" y="1113" font-size="12" fill="#111" text-anchor="start">ADS1292 双通道验证版 · 整机框图</text><text x="1490" y="1113" font-size="12" fill="#333" text-anchor="start">版本</text><text x="1560" y="1113" font-size="12" fill="#111" text-anchor="start">R9 六触点定稿</text><text x="1190" y="1141" font-size="12" fill="#333" text-anchor="start">图页</text><text x="1270" y="1141" font-size="12" fill="#111" text-anchor="start">1 / 3</text><text x="1490" y="1141" font-size="12" fill="#333" text-anchor="start">日期</text><text x="1560" y="1141" font-size="12" fill="#111" text-anchor="start">2026-11-15</text><text x="1190" y="1169" font-size="12" fill="#333" text-anchor="start">网表</text><text x="1270" y="1169" font-size="12" fill="#111" text-anchor="start">框图与六触点翻面对照（详图见 P3）</text><text x="1490" y="1169" font-size="12" fill="#333" text-anchor="start">尺寸</text><text x="1560" y="1169" font-size="12" fill="#111" text-anchor="start">A3</text></svg>