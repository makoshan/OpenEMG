<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" font-family="PingFang SC, Helvetica, sans-serif"><rect width="1680" height="1188" fill="#fffdf6"/><rect x="10" y="10" width="1660" height="1168" fill="none" stroke="#333" stroke-width="2"/><text x="50" y="62" font-size="28" fill="#111" font-weight="bold">OpenEMG 2 通道六触点验证版（ADS1292 R9）· 电源树与 8 测点验收表（P2）</text><text x="50" y="92" font-size="14" fill="#555">XIAO 背焊锂电 → P44e 20P 排线供入 3V3 → L1 磁珠滤出 DVDD (3.3V) + U3 TPS7A2030 稳压出 AVDD (3.0V)；XIAO_5V 触发 Q1 硬件拉低 ADS_RESET_N</text><rect x="45" y="145" width="250" height="155" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="170" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">锂电池 + XIAO (P44e 板)</text><text x="170" y="201" font-size="12" fill="#333" text-anchor="middle">电池正负线直接焊 XIAO 背面</text><text x="170" y="223" font-size="12" fill="#333" text-anchor="middle">不经过 ADS1292 采集板</text><text x="170" y="245" font-size="12" fill="#333" text-anchor="middle">XIAO 板载 LDO 输出 3V3 (3.30V)</text><text x="170" y="267" font-size="12" fill="#333" text-anchor="middle">插 USB 时 XIAO 5V 脚带电 (5.0V)</text><polyline points="295,220 390,220" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="390,220 380,215 380,225" fill="#1f8a3a"/><text x="342" y="210" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">J1.1/2 → J2.20/19</text><text x="342" y="238" font-size="11" fill="#555" text-anchor="middle">20P FFC 排线</text><rect x="390" y="145" width="260" height="155" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="520" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">采集板 3V3 干线 (P3 C/F框)</text><text x="520" y="201" font-size="12" fill="#333" text-anchor="middle">J2.19/20 脚进入采集板 3V3</text><text x="520" y="223" font-size="12" fill="#333" text-anchor="middle">C16 (10µF) 入口干线去耦</text><text x="520" y="245" font-size="12" fill="#333" text-anchor="middle">TP2 测点直测 3V3 = 3.30 V</text><text x="520" y="267" font-size="12" fill="#333" text-anchor="middle">分两路：数字 DVDD 与模拟 U3</text><polyline points="650,185 760,185" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="760,185 750,180 750,190" fill="#1f8a3a"/><text x="705" y="175" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">L1 磁珠 (120Ω@100M)</text><text x="705" y="203" font-size="11" fill="#555" text-anchor="middle">数字电源滤波</text><polyline points="650,260 760,260" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="760,260 750,255 750,265" fill="#1f8a3a"/><text x="705" y="250" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">U3.1 IN &amp; U3.3 EN</text><text x="705" y="278" font-size="11" fill="#555" text-anchor="middle">常开模拟 LDO</text><rect x="760" y="125" width="340" height="105" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="930" y="155" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">DVDD 数字电源轨 = 3.30 V (P3 B/F框)</text><text x="930" y="181" font-size="12" fill="#333" text-anchor="middle">C12 (100nF) + C13 (10µF) 贴 U1.23 脚去耦</text><text x="930" y="203" font-size="12" fill="#333" text-anchor="middle">供 U1.23 (DVDD) 及 U1.14 (CLKSEL=1 内时钟)</text><rect x="760" y="245" width="340" height="120" fill="#fffdf4" stroke="#a8322d" stroke-width="1.8"/><text x="930" y="275" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">U3 TPS7A2030PDBVR → AVDD = 3.00 V (P3 D/F框)</text><text x="930" y="301" font-size="12" fill="#333" text-anchor="middle">超低噪声 LDO：C14 (1µF) 输入、C15 (1µF) 输出</text><text x="930" y="323" font-size="12" fill="#333" text-anchor="middle">TP1 测点 + C10 (100nF) / C11 (10µF) 贴 U1.12 脚</text><text x="930" y="345" font-size="12" fill="#333" text-anchor="middle">R26 (100kΩ) 引出 AVDD_SENSE (J2.3) 供 XIAO ADC 监测</text><polyline points="1100,305 1195,305" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="1195,305 1185,300 1185,310" fill="#1f8a3a"/><text x="1147" y="295" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">AVDD 3.00V</text><text x="1147" y="323" font-size="11" fill="#555" text-anchor="middle">U1.12 / 31 / 32</text><rect x="1195" y="135" width="435" height="230" fill="#fffdf4" stroke="#1d3f9a" stroke-width="1.8"/><text x="1412" y="165" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">U1 ADS1292IPBSR 内部基准与电荷泵节点 (P3 B框)</text><text x="1412" y="191" font-size="12" fill="#333" text-anchor="middle">• VREFP (9脚)：内部 2.42 V 参考输出，外接 C6 (100nF) ∥ C7 (10µF)</text><text x="1412" y="213" font-size="12" fill="#333" text-anchor="middle">• VCAP1 (11脚)：内部带隙节点 ≈ 1.20 V，外接 C8 (1µF) 对 GND</text><text x="1412" y="235" font-size="12" fill="#333" text-anchor="middle">• VCAP2 (27脚)：内部偏置节点 ≈ 1.50 V (AVDD/2)，外接 C9 (1µF)</text><text x="1412" y="257" font-size="12" fill="#333" text-anchor="middle">• RLDOUT (30脚)：内部 AVDD/2 参考，静态输出 ≈ 1.50 V</text><text x="1412" y="279" font-size="12" fill="#333" text-anchor="middle">• AVSS (13脚) / VREFN (10脚) / DGND (24脚)：共地 GND (TP3)</text><rect x="45" y="385" width="1585" height="130" fill="#fffdf4" stroke="#a8322d" stroke-width="1.8"/><text x="837" y="415" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">USB 硬件断电互锁链（P3 D框：J2.2 XIAO_5V → R32 0R → R25 10kΩ → Q1 AO3400A → 拉低 ADS_RESET_N / TP8）</text><text x="837" y="441" font-size="12" fill="#333" text-anchor="middle">• 正常电池供电（未插 USB）：XIAO_5V = 0V → R25 (10kΩ) 将 Q1 栅极拉低 → Q1 截止 → MCU_PWDN 经 R31 (4.7kΩ) 正常驱动 ADS_RESET_N (U1.15) = 3.3V，ADS1292 正常采样</text><text x="837" y="463" font-size="12" fill="#333" text-anchor="middle">• 插入 USB 线（XIAO_5V ≈ 5.0V，R32 0R 在位）：Q1 (AO3400A) 栅极得电导通 → 将漏极 ADS_RESET_N (TP8 / U1.15) 硬件强拉到 GND (&lt; 0.1V)，ADS1292 立即进入硬掉电复位态</text><text x="837" y="485" font-size="12" fill="#333" text-anchor="middle">• 台架离体带 USB 联调方法：仅在脱离人体台架测试时，拆下 R32 (0R)，此时 R25 保持 Q1 关断；上人体前必须焊回 R32 并实测插 USB 时 TP8 &lt; 0.1V！</text><rect x="45" y="540" width="1585" height="515" fill="none" stroke="#4a4a4a" stroke-width="1.6"/><text x="65" y="572" font-size="19" fill="#111" font-weight="bold">离体上电 8 项必检测试点与预期值总表（含 PCB 物理坐标、设计值与实测填写格）</text><polyline points="55,584 1615,584" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="612" font-size="11" fill="#111" font-weight="bold">测点 / 位置</text><text x="175" y="612" font-size="11" fill="#111" font-weight="bold">网络名称</text><text x="310" y="612" font-size="11" fill="#111" font-weight="bold">KiCad 坐标 (mm)</text><text x="445" y="612" font-size="11" fill="#111" font-weight="bold">信号功能与链路归属</text><text x="855" y="612" font-size="11" fill="#111" font-weight="bold">设计标称值</text><text x="1065" y="612" font-size="11" fill="#111" font-weight="bold">合格判据</text><text x="1265" y="612" font-size="11" fill="#111" font-weight="bold">首板实测值</text><text x="1485" y="612" font-size="11" fill="#111" font-weight="bold">判定</text><polyline points="55,629 1615,629" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="657" font-size="11" fill="#a8322d" font-weight="normal">TP3</text><text x="175" y="657" font-size="11" fill="#1d3f9a" font-weight="normal">GND</text><text x="310" y="657" font-size="11" fill="#222" font-weight="normal">(97.0, 110.5)</text><text x="445" y="657" font-size="11" fill="#222" font-weight="normal">全板公共参考地（负表笔基准点，中南侧）</text><text x="855" y="657" font-size="11" fill="#1d3f9a" font-weight="normal">0.00 V</text><text x="1065" y="657" font-size="11" fill="#222" font-weight="normal">基准 0 V</text><text x="1265" y="657" font-size="11" fill="#222" font-weight="normal">基准点</text><text x="1485" y="657" font-size="11" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,674 1615,674" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="702" font-size="11" fill="#a8322d" font-weight="normal">TP2</text><text x="175" y="702" font-size="11" fill="#1d3f9a" font-weight="normal">3V3</text><text x="310" y="702" font-size="11" fill="#222" font-weight="normal">(98.9, 108.6)</text><text x="445" y="702" font-size="11" fill="#222" font-weight="normal">J2.19/20 入口主数字电源轨（经 L1 供 DVDD）</text><text x="855" y="702" font-size="11" fill="#1d3f9a" font-weight="normal">3.30 V</text><text x="1065" y="702" font-size="11" fill="#222" font-weight="normal">3.20 – 3.40 V</text><text x="1265" y="702" font-size="11" fill="#222" font-weight="normal">[          ] V</text><text x="1485" y="702" font-size="11" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,719 1615,719" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="747" font-size="11" fill="#a8322d" font-weight="normal">TP1</text><text x="175" y="747" font-size="11" fill="#1d3f9a" font-weight="normal">AVDD</text><text x="310" y="747" font-size="11" fill="#222" font-weight="normal">(97.9, 93.0)</text><text x="445" y="747" font-size="11" fill="#222" font-weight="normal">U3 TPS7A2030Pin5 输出低噪声模拟电源轨</text><text x="855" y="747" font-size="11" fill="#1d3f9a" font-weight="normal">3.00 V</text><text x="1065" y="747" font-size="11" fill="#222" font-weight="normal">2.94 – 3.06 V</text><text x="1265" y="747" font-size="11" fill="#222" font-weight="normal">[          ] V</text><text x="1485" y="747" font-size="11" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,764 1615,764" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="792" font-size="11" fill="#a8322d" font-weight="normal">TP8</text><text x="175" y="792" font-size="11" fill="#1d3f9a" font-weight="normal">ADS_RESET_N</text><text x="310" y="792" font-size="11" fill="#222" font-weight="normal">(94.4, 113.8)</text><text x="445" y="792" font-size="11" fill="#222" font-weight="normal">U1.15 复位/掉电脚（电池态高；插USB态低）</text><text x="855" y="792" font-size="11" fill="#1d3f9a" font-weight="normal">3.3V (电池) / 0V (USB)</text><text x="1065" y="792" font-size="11" fill="#222" font-weight="normal">≥3.0V / ≤0.1V</text><text x="1265" y="792" font-size="11" fill="#222" font-weight="normal">[      /     ] V</text><text x="1485" y="792" font-size="11" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,809 1615,809" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="837" font-size="11" fill="#a8322d" font-weight="normal">C7.1 / C6.1</text><text x="175" y="837" font-size="11" fill="#1d3f9a" font-weight="normal">VREFP</text><text x="310" y="837" font-size="11" fill="#222" font-weight="normal">(87.1, 96.5)</text><text x="445" y="837" font-size="11" fill="#222" font-weight="normal">U1.9 内部 2.42V 参考电压（CONFIG2 启内部参考）</text><text x="855" y="837" font-size="11" fill="#1d3f9a" font-weight="normal">2.42 V</text><text x="1065" y="837" font-size="11" fill="#222" font-weight="normal">2.38 – 2.46 V</text><text x="1265" y="837" font-size="11" fill="#222" font-weight="normal">[          ] V</text><text x="1485" y="837" font-size="11" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,854 1615,854" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="882" font-size="11" fill="#a8322d" font-weight="normal">J2.17</text><text x="175" y="882" font-size="11" fill="#1d3f9a" font-weight="normal">ADS_DRDY_N</text><text x="310" y="882" font-size="11" fill="#222" font-weight="normal">(108.75, 109.55)</text><text x="445" y="882" font-size="11" fill="#222" font-weight="normal">U1.22 数据就绪脉冲（连续采样态 500 SPS）</text><text x="855" y="882" font-size="11" fill="#1d3f9a" font-weight="normal">500 Hz 负脉冲</text><text x="1065" y="882" font-size="11" fill="#222" font-weight="normal">500 Hz ± 2%</text><text x="1265" y="882" font-size="11" fill="#222" font-weight="normal">[          ] Hz</text><text x="1485" y="882" font-size="11" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,899 1615,899" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="927" font-size="11" fill="#a8322d" font-weight="normal">R18.1 / R23.1</text><text x="175" y="927" font-size="11" fill="#1d3f9a" font-weight="normal">ADS_SCLK</text><text x="310" y="927" font-size="11" fill="#222" font-weight="normal">(93.9, 108.7)</text><text x="445" y="927" font-size="11" fill="#222" font-weight="normal">U1.20 SPI 时钟（未插主控时由 R18 47kΩ 下拉低）</text><text x="855" y="927" font-size="11" fill="#1d3f9a" font-weight="normal">0V (空载) / SCLK</text><text x="1065" y="927" font-size="11" fill="#222" font-weight="normal">空载 ≤ 0.05 V</text><text x="1265" y="927" font-size="11" fill="#222" font-weight="normal">[          ] V</text><text x="1485" y="927" font-size="11" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,944 1615,944" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="972" font-size="11" fill="#a8322d" font-weight="normal">R25.1 / Q1.1</text><text x="175" y="972" font-size="11" fill="#1d3f9a" font-weight="normal">ILK_VBUS</text><text x="310" y="972" font-size="11" fill="#222" font-weight="normal">(87.7, 111.45)</text><text x="445" y="972" font-size="11" fill="#222" font-weight="normal">USB 互锁栅极（R32 在位：电池 0V / 插 USB 5V）</text><text x="855" y="972" font-size="11" fill="#1d3f9a" font-weight="normal">0V (电池) / 5V (USB)</text><text x="1065" y="972" font-size="11" fill="#222" font-weight="normal">≤0.05V / ≥4.5V</text><text x="1265" y="972" font-size="11" fill="#222" font-weight="normal">[      /     ] V</text><text x="1485" y="972" font-size="11" fill="#222" font-weight="normal">□ PASS</text><text x="40" y="1125" font-size="22" fill="#111" text-anchor="start" font-weight="bold">ADS1292 双通道六触点验证版 · 电源树与 8 测点离体上电表（P2）</text><text x="40" y="1155" font-size="12" fill="#555" text-anchor="start" font-weight="normal">3V3 → L1 DVDD (3.3V) + U3 TPS7A2030 AVDD (3.0V) → U1 ADS1292；XIAO_5V → Q1 AO3400A 硬件断电互锁</text><rect x="1180" y="1094" width="470" height="84" fill="none" stroke="#333" stroke-width="1.4"/><polyline points="1180,1122 1650,1122" fill="none" stroke="#333" stroke-width="1"/><polyline points="1180,1150 1650,1150" fill="none" stroke="#333" stroke-width="1"/><polyline points="1260,1094 1260,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1480,1094 1480,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1550,1094 1550,1178" fill="none" stroke="#333" stroke-width="1"/><text x="1190" y="1113" font-size="12" fill="#333" text-anchor="start">图名</text><text x="1270" y="1113" font-size="12" fill="#111" text-anchor="start">ADS1292 双通道验证版 · 电源树</text><text x="1490" y="1113" font-size="12" fill="#333" text-anchor="start">版本</text><text x="1560" y="1113" font-size="12" fill="#111" text-anchor="start">R9 六触点定稿</text><text x="1190" y="1141" font-size="12" fill="#333" text-anchor="start">图页</text><text x="1270" y="1141" font-size="12" fill="#111" text-anchor="start">2 / 3</text><text x="1490" y="1141" font-size="12" fill="#333" text-anchor="start">日期</text><text x="1560" y="1141" font-size="12" fill="#111" text-anchor="start">2026-11-15</text><text x="1190" y="1169" font-size="12" fill="#333" text-anchor="start">网表</text><text x="1270" y="1169" font-size="12" fill="#111" text-anchor="start">电源轨与 8 测点上电记录表</text><text x="1490" y="1169" font-size="12" fill="#333" text-anchor="start">尺寸</text><text x="1560" y="1169" font-size="12" fill="#111" text-anchor="start">A3</text></svg>