<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="265" viewBox="0 0 1160 265" xml:lang="zh"><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#216458"/></marker></defs><rect width="1160" height="265" fill="#fcfbf7"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#192b29"><title>OpenEMG v0.01 · 整机框图</title><text x="24" y="40" font-size="25" text-anchor="start" font-weight="600">OpenEMG v0.01 · 整机框图</text><rect x="24" y="100" width="230" height="84" fill="#fff" stroke="#263837" stroke-width="1.6"/><text x="139.0" y="138.0" font-size="20" text-anchor="middle" font-weight="600">表带与主机底部电极</text><text x="139.0" y="164.0" font-size="16" text-anchor="middle" font-weight="400">16 对采样触点</text><rect x="326" y="100" width="230" height="84" fill="#fff" stroke="#263837" stroke-width="1.6"/><text x="441.0" y="138.0" font-size="20" text-anchor="middle" font-weight="600">16 通道采集板</text><text x="441.0" y="164.0" font-size="16" text-anchor="middle" font-weight="400">双 ADS1298，各采 8 路</text><rect x="638" y="100" width="205" height="84" fill="#fff" stroke="#263837" stroke-width="1.6"/><text x="740.5" y="138.0" font-size="20" text-anchor="middle" font-weight="600">采样主控</text><text x="740.5" y="164.0" font-size="16" text-anchor="middle" font-weight="400">STM32L432KCU6</text><rect x="936" y="100" width="205" height="84" fill="#fff" stroke="#263837" stroke-width="1.6"/><text x="1038.5" y="138.0" font-size="20" text-anchor="middle" font-weight="600">蓝牙</text><text x="1038.5" y="164.0" font-size="16" text-anchor="middle" font-weight="400">nRF52840</text><path d="M254 142H324" fill="none" stroke="#216458" stroke-width="2" marker-end="url(#arrow)"/><text x="290.0" y="131" font-size="16" text-anchor="middle" font-weight="400">2 × 30P</text><path d="M556 142H636" fill="none" stroke="#216458" stroke-width="2" marker-end="url(#arrow)"/><text x="597.0" y="131" font-size="16" text-anchor="middle" font-weight="400">SPI1</text><path d="M843 142H934" fill="none" stroke="#216458" stroke-width="2" marker-end="url(#arrow)"/><text x="889.5" y="131" font-size="16" text-anchor="middle" font-weight="400">SPI3</text><text x="24" y="217" font-size="17" text-anchor="start" font-weight="400">采样数据通过 20 针排线送到主控。主控用 SPI1 配置采集芯片，并读取两颗芯片的数据。</text><text x="24" y="244" font-size="17" text-anchor="start" font-weight="400">nRF52840 负责通过 BLE 将数据发往桌面工作台。整机传输仍待台架验证。</text></g></svg>
