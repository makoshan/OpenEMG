<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="265" viewBox="0 0 1160 265" xml:lang="en"><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#216458"/></marker></defs><rect width="1160" height="265" fill="#fcfbf7"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#192b29"><title>OpenEMG v0.01 · System block diagram</title><text x="24" y="40" font-size="25" text-anchor="start" font-weight="600">OpenEMG v0.01 · System block diagram</text><rect x="24" y="100" width="230" height="84" fill="#fff" stroke="#263837" stroke-width="1.6"/><text x="139.0" y="138.0" font-size="20" text-anchor="middle" font-weight="600">Skin electrodes</text><text x="139.0" y="164.0" font-size="16" text-anchor="middle" font-weight="400">16 pairs on strap and case</text><rect x="326" y="100" width="230" height="84" fill="#fff" stroke="#263837" stroke-width="1.6"/><text x="441.0" y="138.0" font-size="20" text-anchor="middle" font-weight="600">16-channel AFE</text><text x="441.0" y="164.0" font-size="16" text-anchor="middle" font-weight="400">2 × ADS1298 · 8 channels each</text><rect x="638" y="100" width="205" height="84" fill="#fff" stroke="#263837" stroke-width="1.6"/><text x="740.5" y="138.0" font-size="20" text-anchor="middle" font-weight="600">Main controller</text><text x="740.5" y="164.0" font-size="16" text-anchor="middle" font-weight="400">STM32L432KCU6</text><rect x="936" y="100" width="205" height="84" fill="#fff" stroke="#263837" stroke-width="1.6"/><text x="1038.5" y="138.0" font-size="20" text-anchor="middle" font-weight="600">Bluetooth</text><text x="1038.5" y="164.0" font-size="16" text-anchor="middle" font-weight="400">nRF52840</text><path d="M254 142H324" fill="none" stroke="#216458" stroke-width="2" marker-end="url(#arrow)"/><text x="290.0" y="131" font-size="16" text-anchor="middle" font-weight="400">2 × 30P</text><path d="M556 142H636" fill="none" stroke="#216458" stroke-width="2" marker-end="url(#arrow)"/><text x="597.0" y="131" font-size="16" text-anchor="middle" font-weight="400">SPI1</text><path d="M843 142H934" fill="none" stroke="#216458" stroke-width="2" marker-end="url(#arrow)"/><text x="889.5" y="131" font-size="16" text-anchor="middle" font-weight="400">SPI3</text><text x="24" y="217" font-size="17" text-anchor="start" font-weight="400">A 20-pin ribbon carries the SPI1 interface. The STM32 configures both converters and reads their samples.</text><text x="24" y="244" font-size="17" text-anchor="start" font-weight="400">The nRF52840 provides the BLE link to the desktop app. End-to-end streaming awaits bench testing.</text></g></svg>
