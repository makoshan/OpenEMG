t x="1237" y="231" font-size="12" fill="#333" text-anchor="middle">• 北侧 V4_FPC1（FH34SRJ-34S-0.5SH，坐标 X=21.55, Y=3.45mm，旋转 90°）：翻盖插口朝北（外侧），接 D2-8CH 表带软板 34P 金手指</text><text x="1237" y="253" font-size="12" fill="#333" text-anchor="middle">  - 脚 1 在西侧（左），脚 34 在东侧（右）；背面无器件（V4_FPC3 已删，严禁往背面焊座子）</text><text x="1237" y="275" font-size="12" fill="#333" text-anchor="middle">• 东侧 J_AFE（FH34SRJ-20S-0.5SH，坐标 X=39.95, Y=18.25mm，旋转 0°）：翻盖插口朝东（外侧），接 20P 0.5mm 板间软排线</text><text x="1237" y="297" font-size="12" fill="#333" text-anchor="middle">  - 采集板 J_AFE 的 2、3、4、13 脚悬空 NC（无背面从片 U2）；19、20 脚为 3V3 电源输入，1、12、14、21、22 脚为 GND</text><text x="1237" y="319" font-size="12" fill="#333" text-anchor="middle">• 正面主芯片 V4_U1（ADS1298IPAGR，坐标 X=23.59, Y=21.15mm，旋转 180°）：第 1 脚（IN8N）在左上角（西北角）</text><text x="865" y="432" font-size="16" fill="#a8322d" font-weight="bold">2. 20P 板间 U 形排线逐针映射表（采集板 J_AFE 脚 k ↔ 主控板 R4U6 J_AFE 脚 21−k）</text><polyline points="860,445 1620,445" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="862" y="468" font-size="10" fill="#111" font-weight="bold">采集板 J_AFE</text><text x="952" y="468" font-size="10" fill="#111" font-weight="bold">采集板网名</text><text x="1042" y="468" font-size="10" fill="#111" font-weight="bold">主控板 J_AFE</text><text x="1138" y="468" font-size="10" fill="#111" font-weight="bold">主控板网名</text><text x="1236" y="468" font-size="10" fill="#111" font-weight="bold">信号方向与串联/上下拉元件</text><text x="1482" y="468" font-size="10" fill="#111" font-weight="bold">U1 / L432 对应引脚</text><polyline points="860,481 1620,481" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="862" y="504" font-size="10" fill="#1d3f9a" font-weight="normal">脚 19, 20</text><text x="952" y="504" font-size="10" fill="#222" font-weight="normal">3V3</text><text x="1042" y="504" font-size="10" fill="#1d3f9a" font-weight="normal">脚 2, 1</text><text x="1138" y="504" font-size="10" fill="#222" font-weight="normal">3V3_AFE</text><text x="1236" y="504" font-size="10" fill="#222" font-weight="normal">主控