<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" font-family="PingFang SC, Helvetica, sans-serif"><rect width="1680" height="1188" fill="#fffdf6"/><rect x="10" y="10" width="1660" height="1168" fill="none" stroke="#333" stroke-width="2"/><text x="50" y="62" font-size="28" fill="#111" font-weight="bold">OpenEMG 8-Channel Single-Sided Wristband · System Block Diagram (P1)</text><text x="50" y="92" font-size="14" fill="#555">Signal chain: 18 skin contacts -&gt; D2-8CH FPC -&gt; V4_FPC1 34P -&gt; D20-8CH AFE -&gt; J_AFE 20P FFC -&gt; R4U6 Dual-MCU -&gt; Host CH1-CH8</text><rect x="45" y="140" width="250" height="210" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="170" y="170" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">1. 18 Skin Contacts</text><text x="170" y="196" font-size="12" fill="#333" text-anchor="middle">Capsule Bottom: CH1-2 + EB1/EB2</text><text x="170" y="218" font-size="12" fill="#333" text-anchor="middle">North Strap: CH3-4 (20mm pitch)</text><text x="170" y="240" font-size="12" fill="#333" text-anchor="middle">South Strap: CH5-8 (circumferential)</text><text x="170" y="262" font-size="12" fill="#333" text-anchor="middle">Row layout: Main(P)-Aux(EB)-Main(N)</text><text x="170" y="284" font-size="12" fill="#333" text-anchor="middle">4.2mm ENIG pads / fault barrier</text><polyline points="295,245 365,245" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="365,245 355,240 355,250" fill="#1f8a3a"/><text x="330" y="235" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">16 Sig + 2 Bias</text><text x="330" y="263" font-size="11" fill="#555" text-anchor="middle">Skin Input</text><rect x="365" y="140" width="270" height="210" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="500" y="170" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">2. D2-8CH Strap FPC</text><text x="500" y="196" font-size="12" fill="#333" text-anchor="middle">4-Layer PI FPC + TPU95A</text><text x="500" y="218" font-size="12" fill="#333" text-anchor="middle">R1-R16: 100kOhm 0402 limiters</text><text x="500" y="240" font-size="12" fill="#333" text-anchor="middle">R33-R34: 200kOhm 0603 limiters</text><text x="500" y="262" font-size="12" fill="#333" text-anchor="middle">EB1/EB2 merge to Pin 33</text><text x="500" y="284" font-size="12" fill="#333" text-anchor="middle">34P 0.5mm gold fingers</text><polyline points="635,245 715,245" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="715,245 705,240 705,250" fill="#1f8a3a"/><text x="675" y="235" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">V4_FPC1 (34P)</text><text x="675" y="263" font-size="11" fill="#555" text-anchor="middle">See P9 Input</text><rect x="715" y="125" width="315" height="240" fill="#fffdf4" stroke="#a8322d" stroke-width="1.8"/><text x="872" y="155" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">3. D20-8CH Single-Sided AFE</text><text x="872" y="181" font-size="12" fill="#333" text-anchor="middle">Top: 76 parts · Bottom: 0 parts</text><text x="872" y="203" font-size="12" fill="#333" text-anchor="middle">D910-D927: 18x ESD401DPYR</text><text x="872" y="225" font-size="12" fill="#333" text-anchor="middle">V4_U3-U6: 15kOhm (115k total)</text><text x="872" y="247" font-size="12" fill="#333" text-anchor="middle">V4_C72-C79: 22pF diff filter</text><text x="872" y="269" font-size="12" fill="#333" text-anchor="middle">V4_U1: 1x ADS1298IPAGR (CH1-8)</text><text x="872" y="291" font-size="12" fill="#333" text-anchor="middle">392k RLD · 2.048MHz XO (P8)</text><polyline points="1030,245 1125,245" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="1125,245 1115,240 1115,250" fill="#1f8a3a"/><text x="1077" y="235" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">J_AFE (20P FFC)</text><text x="1077" y="263" font-size="11" fill="#555" text-anchor="middle">k &lt;-&gt; 21-k (P6/P11)</text><rect x="1125" y="125" width="285" height="240" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="1267" y="155" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">4. R4U6 Dual-MCU Board (6L)</text><text x="1267" y="181" font-size="12" fill="#333" text-anchor="middle">U2/U3: Level buffer + 33R</text><text x="1267" y="203" font-size="12" fill="#333" text-anchor="middle">U18: STM32L432 (SPI1 AFE)</text><text x="1267" y="225" font-size="12" fill="#333" text-anchor="middle">U13: nRF52840 (SPI3 + BLE)</text><text x="1267" y="247" font-size="12" fill="#333" text-anchor="middle">U16: ICM-42688-P IMU (P4)</text><text x="1267" y="269" font-size="12" fill="#333" text-anchor="middle">USB hardware interlock (P3)</text><text x="1267" y="291" font-size="12" fill="#333" text-anchor="middle">See P3-P7 Mainboard Sch</text><polyline points="1410,245 1480,245" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="1480,245 1470,240 1470,250" fill="#1f8a3a"/><text x="1445" y="235" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">BLE / Bench USB</text><text x="1445" y="263" font-size="11" fill="#555" text-anchor="middle">Wireless Skin</text><rect x="1480" y="140" width="155" height="210" fill="#fffdf4" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4"/><text x="1557" y="170" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">5. Host App</text><text x="1557" y="196" font-size="12" fill="#333" text-anchor="middle">OpenEMG App</text><text x="1557" y="218" font-size="12" fill="#333" text-anchor="middle">CH1-CH8 Waveforms</text><text x="1557" y="240" font-size="12" fill="#333" text-anchor="middle">500 / 1000 SPS</text><text x="1557" y="262" font-size="12" fill="#333" text-anchor="middle">24-bit Raw Archive</text><text x="1557" y="284" font-size="12" fill="#333" text-anchor="middle">Gesture Inference</text><rect x="45" y="420" width="785" height="630" fill="none" stroke="#4a4a4a" stroke-width="1.6"/><text x="65" y="452" font-size="19" fill="#111" font-weight="bold">A  11-Page Schematic Index &amp; Cross-Sheet Signal Map (6 Pages in Standalone AFE PDF)</text><polyline points="60,460 815,460" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="488" font-size="11" fill="#111" font-weight="bold">汇总页码</text><text x="155" y="488" font-size="11" fill="#111" font-weight="bold">独立AFE页码</text><text x="255" y="488" font-size="11" fill="#1d3f9a" font-weight="bold">图页名称</text><text x="415" y="488" font-size="11" fill="#111" font-weight="bold">核心器件与页间接口去向</text><polyline points="60,506 815,506" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="534" font-size="11" fill="#222" font-weight="normal">P1 (1/11)</text><text x="155" y="534" font-size="11" fill="#222" font-weight="normal">P1 (1/6)</text><text x="255" y="534" font-size="11" fill="#1d3f9a" font-weight="normal">01.01 整机框图</text><text x="415" y="534" font-size="11" fill="#222" font-weight="normal">贴肤 18 触点 → D2-8CH 软板 → D20-8CH 采集板 → R4U6 主控 → 桌面 CH1–CH8</text><polyline points="60,552 815,552" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="580" font-size="11" fill="#222" font-weight="normal">P2 (2/11)</text><text x="155" y="580" font-size="11" fill="#222" font-weight="normal">P2 (2/6)</text><text x="255" y="580" font-size="11" fill="#1d3f9a" font-weight="normal">01.02 电源树</text><text x="415" y="580" font-size="11" fill="#222" font-weight="normal">VBUS/VBAT → TP4054 → TLV75533 3V3 → R801 3V3_AFE → LM27762 ±2.5V + USB 互锁</text><polyline points="60,598 815,598" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="626" font-size="11" fill="#222" font-weight="normal">P3 (3/11)</text><text x="155" y="626" font-size="11" fill="#222" font-weight="normal">— (主控板)</text><text x="255" y="626" font-size="11" fill="#1d3f9a" font-weight="normal">01.03 主控电源与互锁</text><text x="415" y="626" font-size="11" fill="#222" font-weight="normal">U14 TP4054、Q2 开关机、U15 TLV75533、U12 TPS3808、Q1/Q701/JP701 USB 断电互锁</text><polyline points="60,644 815,644" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="672" font-size="11" fill="#222" font-weight="normal">P4 (4/11)</text><text x="155" y="672" font-size="11" fill="#222" font-weight="normal">— (主控板)</text><text x="255" y="672" font-size="11" fill="#1d3f9a" font-weight="normal">01.04 蓝牙与 IMU</text><text x="415" y="672" font-size="11" fill="#222" font-weight="normal">U13 nRF52840-QIAA、32M/32.768k 晶振、天线匹配、U16 ICM-42688-P、SW300 按键</text><polyline points="60,690 815,690" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="718" font-size="11" fill="#222" font-weight="normal">P5 (5/11)</text><text x="155" y="718" font-size="11" fill="#222" font-weight="normal">— (主控板)</text><text x="255" y="718" font-size="11" fill="#1d3f9a" font-weight="normal">01.05 USB 与 AFE 缓冲</text><text x="415" y="718" font-size="11" fill="#222" font-weight="normal">J400 沉板 USB-C、U17 USBLC6、U2 SN74AXC8T245、U3/U10 回读缓冲、J301 SWD</text><polyline points="60,736 815,736" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="764" font-size="11" fill="#222" font-weight="normal">P6 (6/11)</text><text x="155" y="764" font-size="11" fill="#222" font-weight="normal">— (主控板)</text><text x="255" y="764" font-size="11" fill="#1d3f9a" font-weight="normal">01.06 主控 J_AFE 接口</text><text x="415" y="764" font-size="11" fill="#222" font-weight="normal">R810–R815 33Ω、R820–R827 47k/100k 默认上下拉、R801 0.47Ω 3V3_AFE、主控 J_AFE 20P</text><polyline points="60,782 815,782" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="810" font-size="11" fill="#222" font-weight="normal">P7 (7/11)</text><text x="155" y="810" font-size="11" fill="#222" font-weight="normal">— (主控板)</text><text x="255" y="810" font-size="11" fill="#1d3f9a" font-weight="normal">01.07 采样主控 L432</text><text x="415" y="810" font-size="11" fill="#222" font-weight="normal">U18 STM32L432KCU6 (SPI1 读 AFE、SPI3 连 nRF、USB 全速)、R209/R210 VBUS_SENSE</text><polyline points="60,828 815,828" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="856" font-size="11" fill="#222" font-weight="normal">P8 (8/11)</text><text x="155" y="856" font-size="11" fill="#222" font-weight="normal">P3 (3/6)</text><text x="255" y="856" font-size="11" fill="#1d3f9a" font-weight="normal">02.01 单 ADS1298 采集</text><text x="415" y="856" font-size="11" fill="#222" font-weight="normal">V4_U1 ADS1298IPAGR (CH1–8)、V4_R24/R34 392k RLD、V4_X1 2.048MHz、V4_R18 0R 分地</text><polyline points="60,874 815,874" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="902" font-size="11" fill="#222" font-weight="normal">P9 (9/11)</text><text x="155" y="902" font-size="11" fill="#222" font-weight="normal">P4 (4/6)</text><text x="255" y="902" font-size="11" fill="#1d3f9a" font-weight="normal">02.02 电极输入与软板串阻</text><text x="415" y="902" font-size="11" fill="#222" font-weight="normal">V4_FPC1 34P、D910–D927 ESD401、V4_U3–U6 15k×4、V4_C72–C79 22pF + 软板 100k/200k 表</text><polyline points="60,920 815,920" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="948" font-size="11" fill="#222" font-weight="normal">P10 (10/11)</text><text x="155" y="948" font-size="11" fill="#222" font-weight="normal">P5 (5/6)</text><text x="255" y="948" font-size="11" fill="#1d3f9a" font-weight="normal">02.03 采集板模拟电源</text><text x="415" y="948" font-size="11" fill="#222" font-weight="normal">V4_LM27762 电荷泵 + LDO 产生 ±2.5V（V4_+2.5V / V4_-2.5V）、D901 PGOOD 绿灯</text><polyline points="60,966 815,966" fill="none" stroke="#e0e4ea" stroke-width="1"/><text x="68" y="994" font-size="11" fill="#222" font-weight="normal">P11 (11/11)</text><text x="155" y="994" font-size="11" fill="#222" font-weight="normal">P6 (6/6)</text><text x="255" y="994" font-size="11" fill="#1d3f9a" font-weight="normal">02.04 采集板 J_AFE 接口</text><text x="415" y="994" font-size="11" fill="#222" font-weight="normal">采集板 J_AFE 20P（脚 2/3/4/13 NC 悬空）、R801 上拉 CS_A、R803–R808 下拉 10kΩ</text><rect x="855" y="420" width="780" height="630" fill="none" stroke="#4a4a4a" stroke-width="1.6"/><text x="875" y="452" font-size="19" fill="#111" font-weight="bold">B  Mechanical Stackup, Single-Fault Safety &amp; D20-8CH vs D20N-8CH Boundary</text><text x="875" y="492" font-size="13" fill="#a8322d" font-weight="bold">1. 为什么做纯单面 8 通道（D20-8CH）：</text><text x="890" y="516" font-size="12" fill="#222">删去背面从片 V4_U2、南侧 V4_FPC3 及背面全部 53 个封装，背面变成 0 器件纯阻</text><text x="890" y="536" font-size="12" fill="#222">焊铜皮；302025 锂电池直接平贴在采集板背面，上盖 R12 压薄 1.1 mm，整机高度由 </text><text x="890" y="556" font-size="12" fill="#222">10.6 mm 降至 9.5 mm。</text><text x="875" y="588" font-size="13" fill="#a8322d" font-weight="bold">2. 两级贴肤限流（IEC 60601-1 单故障 ≤ 10 µA）：</text><text x="890" y="612" font-size="12" fill="#222">采样通路：D2-8CH 软板 100 kΩ (0402) + 采集板 15 kΩ = 115 k</text><text x="890" y="632" font-size="12" fill="#222">Ω/腿（差分回路 230 kΩ）；偏置通路：软板 200 kΩ (0603) + 采集板 V4_</text><text x="890" y="652" font-size="12" fill="#222">R34 392 kΩ = 单点 592 kΩ / 双点并联 492 kΩ。±2.5V 轨单故障电</text><text x="890" y="672" font-size="12" fill="#222">流 ≤ 21.7 µA（两级同时贴装）。</text><text x="875" y="704" font-size="13" fill="#a8322d" font-weight="bold">3. USB 硬件断电互锁（人体佩戴禁插 USB）：</text><text x="890" y="728" font-size="12" fill="#222">主控板 P3 页 Q1 + R703 检测 VBUS 5V：一旦插入 USB 线且未贴 JP70</text><text x="890" y="748" font-size="12" fill="#222">1，硬件直接拉低 EN_RC 关闭 U2/U3 缓冲（OE_N=高）；人体佩戴仅用锂电池 + B</text><text x="890" y="768" font-size="12" fill="#222">LE 无线传输。</text><text x="875" y="800" font-size="13" fill="#a8322d" font-weight="bold">4. 板间 20P U 形排线翻面法则（k ↔ 21−k）：</text><text x="890" y="824" font-size="12" fill="#222">主控板 J_AFE 与采集板 J_AFE 均位于东南侧（X=35.89, Y=28.75mm），</text><text x="890" y="844" font-size="12" fill="#222">用同向（A面）0.5mm 20P FFC 作 U 形对折连接：采集板脚 k 对应主控板脚 21−</text><text x="890" y="864" font-size="12" fill="#222">k（例：采集板 19/20 脚 3V3 ↔ 主控板 2/1 脚 3V3_AFE；采集板 10 脚</text><text x="890" y="884" font-size="12" fill="#222"> ADS_CS_A ↔ 主控板 11 脚 AFE_CS_A）。</text><text x="875" y="916" font-size="13" fill="#a8322d" font-weight="bold">5. 主打样版 vs 备选版边界：</text><text x="890" y="940" font-size="12" fill="#222">• 主打样版：圆孔版 afe-d20-8ch + R4U6 主控 + R12 圆孔外壳（推荐首轮</text><text x="890" y="960" font-size="12" fill="#222">下单）。</text><text x="890" y="982" font-size="12" fill="#222">• 备选结构变体：四角缺口版 afe-d20n-8ch + R4U6N 主控 + R13 定位销</text><text x="890" y="1002" font-size="12" fill="#222">外壳（仅板框四角改为 3.2×3.2mm 缺口，电气网表与 BOM/CPL 100% 相同）。</text><text x="40" y="1125" font-size="22" fill="#111" text-anchor="start" font-weight="bold">OpenEMG 8 通道单面腕带 · 整机框图与原理图总索引</text><text x="40" y="1155" font-size="12" fill="#555" text-anchor="start" font-weight="normal">贴肤 18 触点（12+2+2）→ D2-8CH 软板（100k/200k）→ D20-8CH 单面采集板（ADS1298 U1）→ R4U6 双核主控 → BLE/USB</text><rect x="1180" y="1094" width="470" height="84" fill="none" stroke="#333" stroke-width="1.4"/><polyline points="1180,1122 1650,1122" fill="none" stroke="#333" stroke-width="1"/><polyline points="1180,1150 1650,1150" fill="none" stroke="#333" stroke-width="1"/><polyline points="1260,1094 1260,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1480,1094 1480,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1550,1094 1550,1178" fill="none" stroke="#333" stroke-width="1"/><text x="1190" y="1113" font-size="12" fill="#333" text-anchor="start">图名</text><text x="1270" y="1113" font-size="12" fill="#111" text-anchor="start">C08B 8通道腕带 · 整机框图</text><text x="1490" y="1113" font-size="12" fill="#333" text-anchor="start">版本</text><text x="1560" y="1113" font-size="12" fill="#111" text-anchor="start">D20-8CH + R4U6</text><text x="1190" y="1141" font-size="12" fill="#333" text-anchor="start">图页</text><text x="1270" y="1141" font-size="12" fill="#111" text-anchor="start">1 / 11</text><text x="1490" y="1141" font-size="12" fill="#333" text-anchor="start">日期</text><text x="1560" y="1141" font-size="12" fill="#111" text-anchor="start">2026-11-15</text><text x="1190" y="1169" font-size="12" fill="#333" text-anchor="start">网表</text><text x="1270" y="1169" font-size="12" fill="#111" text-anchor="start">框图与分册索引（逐脚见 P3–P11）</text><text x="1490" y="1169" font-size="12" fill="#333" text-anchor="start">尺寸</text><text x="1560" y="1169" font-size="12" fill="#111" text-anchor="start">A3</text></svg>