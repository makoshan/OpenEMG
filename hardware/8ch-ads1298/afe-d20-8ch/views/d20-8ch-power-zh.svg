<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" font-family="PingFang SC, Helvetica, sans-serif"><rect width="1680" height="1188" fill="#fffdf6"/><rect x="10" y="10" width="1660" height="1168" fill="none" stroke="#333" stroke-width="2"/><text x="50" y="62" font-size="28" fill="#111" font-weight="bold">OpenEMG 8 通道超薄单面腕带 · 电源树与联锁链路（P2）</text><text x="50" y="92" font-size="14" fill="#555">供电轨流向、电流预算、离体上电实测记录格与 USB 硬件断电互锁路径（先脱离人体测通全部电压，再进信号验收）</text><rect x="45" y="145" width="220" height="150" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="155" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">USB-C J400 (主控 P5)</text><text x="155" y="201" font-size="12" fill="#333" text-anchor="middle">VBUS = 5.0 V 输入</text><text x="155" y="223" font-size="12" fill="#333" text-anchor="middle">U17 USBLC6 ESD 保护</text><text x="155" y="245" font-size="12" fill="#333" text-anchor="middle">R206/R207 5.1k CC 下拉</text><text x="155" y="267" font-size="12" fill="#333" text-anchor="middle">R209/R210 分压 → VBUS_SENSE</text><polyline points="265,220 345,220" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="345,220 335,215 335,225" fill="#1f8a3a"/><text x="305" y="210" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">VBUS 5.0V</text><text x="305" y="238" font-size="11" fill="#555" text-anchor="middle">充电管理</text><rect x="345" y="145" width="230" height="150" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="460" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">U14 TP4054 (主控 P3)</text><text x="460" y="201" font-size="12" fill="#333" text-anchor="middle">单节锂电线性充电</text><text x="460" y="223" font-size="12" fill="#333" text-anchor="middle">R202 = 20 kΩ → I_chg ≈ 50 mA</text><text x="460" y="245" font-size="12" fill="#333" text-anchor="middle">J401 接 302025 锂电池</text><text x="460" y="267" font-size="12" fill="#333" text-anchor="middle">R200/R201 1M/1M → VBAT_SENSE</text><polyline points="575,220 655,220" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="655,220 645,215 645,225" fill="#1f8a3a"/><text x="615" y="210" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">VBAT 3.7–4.2V</text><text x="615" y="238" font-size="11" fill="#555" text-anchor="middle">PMOS 开关机</text><rect x="655" y="145" width="230" height="150" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="770" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">Q2 AO3401A + U15 (主控 P3)</text><text x="770" y="201" font-size="12" fill="#333" text-anchor="middle">SW300 按键 → Q2 导通 PWR_EN</text><text x="770" y="223" font-size="12" fill="#333" text-anchor="middle">U15 TLV75533PDBVR 稳压</text><text x="770" y="245" font-size="12" fill="#333" text-anchor="middle">输出主控主轨 3V3 = 3.30 V</text><text x="770" y="267" font-size="12" fill="#333" text-anchor="middle">供 U18 L432 / U13 nRF / U16 IMU</text><polyline points="885,220 975,220" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="975,220 965,215 965,225" fill="#1f8a3a"/><text x="930" y="210" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">3V3 → R801 (0.47Ω)</text><text x="930" y="238" font-size="11" fill="#555" text-anchor="middle">J_AFE 1/2 ↔ 20/19</text><rect x="975" y="145" width="270" height="150" fill="#fffdf4" stroke="#333" stroke-width="1.8"/><text x="1110" y="175" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">采集板 3V3 入口 (采集 P10)</text><text x="1110" y="201" font-size="12" fill="#333" text-anchor="middle">经 20P FFC 19/20 脚进入采集板</text><text x="1110" y="223" font-size="12" fill="#333" text-anchor="middle">C901 10µF 本地去耦</text><text x="1110" y="245" font-size="12" fill="#333" text-anchor="middle">供 V4_U1 DVDD (48/50 脚)</text><text x="1110" y="267" font-size="12" fill="#333" text-anchor="middle">供 V4_X1 2.048MHz 有源晶振</text><polyline points="1245,220 1335,220" fill="none" stroke="#1f8a3a" stroke-width="2"/><polygon points="1335,220 1325,215 1325,225" fill="#1f8a3a"/><text x="1290" y="210" font-size="12" fill="#1d3f9a" text-anchor="middle" font-weight="bold">3V3 常开输入</text><text x="1290" y="238" font-size="11" fill="#555" text-anchor="middle">EN+/EN- 接 VIN</text><rect x="1335" y="130" width="295" height="180" fill="#fffdf4" stroke="#a8322d" stroke-width="1.8"/><text x="1482" y="160" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">V4_LM27762 (采集 P10)</text><text x="1482" y="186" font-size="12" fill="#333" text-anchor="middle">低噪声正负双路 LDO + 电荷泵</text><text x="1482" y="208" font-size="12" fill="#333" text-anchor="middle">R26/R27 (105k/100k) → V4_+2.5V</text><text x="1482" y="230" font-size="12" fill="#333" text-anchor="middle">R29/R28 (105k/100k) → V4_-2.5V</text><text x="1482" y="252" font-size="12" fill="#333" text-anchor="middle">D901 PGOOD 绿灯亮 = 双轨正常</text><text x="1482" y="274" font-size="12" fill="#333" text-anchor="middle">供 V4_U1 AVDD(×6) / AVSS(×7)</text><rect x="975" y="360" width="655" height="165" fill="#fffdf4" stroke="#1d3f9a" stroke-width="1.8"/><text x="1302" y="390" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">V4_U1 ADS1298IPAGR 内部参考与偏置轨（采集 P8 · 对照 V4_-2.5V 测量）</text><text x="1302" y="416" font-size="12" fill="#333" text-anchor="middle">• VREFP (24脚) 对 VREFN/AVSS (25脚 = -2.50V)：CONFIG3=0xEC 使能内部 4.0V 基准 → VREFP − AVSS = 4.00 V（对 AGND 约为 +1.50 V）</text><text x="1302" y="438" font-size="12" fill="#333" text-anchor="middle">• VCAP1 (28脚，V4_C54 22µF 对 -2.5V)：带隙基准滤波点，正常 VCAP1 − AVSS ≈ 1.20 V（对 AGND 约为 −1.30 V，上电必检！）</text><text x="1302" y="460" font-size="12" fill="#333" text-anchor="middle">• RLDREF (60脚) &amp; RLDIN (62脚)：本板接 AGND (0 V)，RLDOUT (63脚) 静态输出集中在 0 V ± 50 mV，经 V4_R34 392kΩ 出 V4_BIAS_DRV1</text><text x="1302" y="482" font-size="12" fill="#333" text-anchor="middle">• 分地唯一连接点：数字地 GND 与模拟地 AGND 仅通过采集板 V4_R18 (0R 0402) 单点桥接，避免数字回流污染微伏级模拟地</text><rect x="45" y="360" width="890" height="165" fill="#fffdf4" stroke="#a8322d" stroke-width="1.8"/><text x="490" y="390" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">USB 硬件断电互锁链（主控 P3/P5 · 防台架电脑市电漏电流经 USB 地线入体）</text><text x="490" y="416" font-size="12" fill="#333" text-anchor="middle">• 正常佩戴态（JP701 空贴，MCU_BENCH_EN = 低）：插入 USB (VBUS = 5V) → R703 上拉 ILK_GATE → Q1 (AO3400A) 导通 → 拉低 EN_RC</text><text x="490" y="438" font-size="12" fill="#333" text-anchor="middle">• 关断动作：EN_RC = 低 → U10 反相输出 OE_N = 高 → 主控缓冲器 U2 (SN74AXC8T245) 与 U3 (SN74AXC2T245) 高阻关断，隔离 AFE 数字口</text><text x="490" y="460" font-size="12" fill="#333" text-anchor="middle">• 同时 VBUS_SENSE 拉高 U18 BOOT0（PH3）并通知 U13 nRF52840：插 USB 上电可直进 STM32 ROM USB DFU 刷机</text><text x="490" y="482" font-size="12" fill="#333" text-anchor="middle">• 台架离体联调旁路：仅在脱离人体、用信号源/模拟器测试时，才允许由固件置高 MCU_BENCH_EN 或短接 JP701 旁路互锁</text><rect x="45" y="560" width="1585" height="495" fill="none" stroke="#4a4a4a" stroke-width="1.6"/><text x="65" y="592" font-size="19" fill="#111" font-weight="bold">离体上电必测电源轨与关键节点验收表（上电前先核阻值无短路，含设计值与实测填写格）</text><polyline points="55,604 1615,604" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="630" font-size="12" fill="#111" font-weight="bold">序号</text><text x="120" y="630" font-size="12" fill="#111" font-weight="bold">网络 / 测点名称</text><text x="310" y="630" font-size="12" fill="#111" font-weight="bold">所在板与图页</text><text x="470" y="630" font-size="12" fill="#111" font-weight="bold">探针测量位置（正表笔 → 负表笔）</text><text x="860" y="630" font-size="12" fill="#111" font-weight="bold">设计标称值</text><text x="1060" y="630" font-size="12" fill="#111" font-weight="bold">合格范围</text><text x="1270" y="630" font-size="12" fill="#111" font-weight="bold">首板实测值</text><text x="1480" y="630" font-size="12" fill="#111" font-weight="bold">判定</text><polyline points="55,645 1615,645" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="671" font-size="12" fill="#222" font-weight="normal">01</text><text x="120" y="671" font-size="12" fill="#1d3f9a" font-weight="normal">VBAT 锂电池轨</text><text x="310" y="671" font-size="12" fill="#222" font-weight="normal">主控板 P3</text><text x="470" y="671" font-size="12" fill="#222" font-weight="normal">J401.1 (BAT+) → J401.2 (GND)</text><text x="860" y="671" font-size="12" fill="#1d3f9a" font-weight="normal">3.70 – 4.20 V</text><text x="1060" y="671" font-size="12" fill="#222" font-weight="normal">3.50 – 4.25 V</text><text x="1270" y="671" font-size="12" fill="#222" font-weight="normal">[          ] V</text><text x="1480" y="671" font-size="12" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,686 1615,686" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="712" font-size="12" fill="#222" font-weight="normal">02</text><text x="120" y="712" font-size="12" fill="#1d3f9a" font-weight="normal">3V3 主控数字轨</text><text x="310" y="712" font-size="12" fill="#222" font-weight="normal">主控板 P3/P5</text><text x="470" y="712" font-size="12" fill="#222" font-weight="normal">J301.2 (3V3) 或 C34.1 → J301.1 (GND)</text><text x="860" y="712" font-size="12" fill="#1d3f9a" font-weight="normal">3.30 V</text><text x="1060" y="712" font-size="12" fill="#222" font-weight="normal">3.20 – 3.40 V</text><text x="1270" y="712" font-size="12" fill="#222" font-weight="normal">[          ] V</text><text x="1480" y="712" font-size="12" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,727 1615,727" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="753" font-size="12" fill="#222" font-weight="normal">03</text><text x="120" y="753" font-size="12" fill="#1d3f9a" font-weight="normal">3V3_AFE 板间供电轨</text><text x="310" y="753" font-size="12" fill="#222" font-weight="normal">主控 P6 / 采集 P10</text><text x="470" y="753" font-size="12" fill="#222" font-weight="normal">主控 C801.1 或采集 C901.2 → GND</text><text x="860" y="753" font-size="12" fill="#1d3f9a" font-weight="normal">3.30 V</text><text x="1060" y="753" font-size="12" fill="#222" font-weight="normal">3.20 – 3.40 V</text><text x="1270" y="753" font-size="12" fill="#222" font-weight="normal">[          ] V</text><text x="1480" y="753" font-size="12" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,768 1615,768" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="794" font-size="12" fill="#222" font-weight="normal">04</text><text x="120" y="794" font-size="12" fill="#1d3f9a" font-weight="normal">V4_+2.5V 正模拟轨</text><text x="310" y="794" font-size="12" fill="#222" font-weight="normal">采集板 P10</text><text x="470" y="794" font-size="12" fill="#222" font-weight="normal">V4_C83.2 或 V4_C33.2 → AGND (V4_R18.2)</text><text x="860" y="794" font-size="12" fill="#1d3f9a" font-weight="normal">+2.50 V</text><text x="1060" y="794" font-size="12" fill="#222" font-weight="normal">+2.42 – +2.58 V</text><text x="1270" y="794" font-size="12" fill="#222" font-weight="normal">[          ] V</text><text x="1480" y="794" font-size="12" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,809 1615,809" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="835" font-size="12" fill="#222" font-weight="normal">05</text><text x="120" y="835" font-size="12" fill="#1d3f9a" font-weight="normal">V4_-2.5V 负模拟轨</text><text x="310" y="835" font-size="12" fill="#222" font-weight="normal">采集板 P10</text><text x="470" y="835" font-size="12" fill="#222" font-weight="normal">V4_C84.2 或 V4_C35.1 → AGND (V4_R18.2)</text><text x="860" y="835" font-size="12" fill="#1d3f9a" font-weight="normal">-2.50 V</text><text x="1060" y="835" font-size="12" fill="#222" font-weight="normal">-2.58 – -2.42 V</text><text x="1270" y="835" font-size="12" fill="#222" font-weight="normal">[          ] V</text><text x="1480" y="835" font-size="12" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,850 1615,850" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="876" font-size="12" fill="#222" font-weight="normal">06</text><text x="120" y="876" font-size="12" fill="#1d3f9a" font-weight="normal">VCAP1 内部带隙节点</text><text x="310" y="876" font-size="12" fill="#222" font-weight="normal">采集板 P8</text><text x="470" y="876" font-size="12" fill="#222" font-weight="normal">V4_C54.2 (U1.28) → V4_C54.1 (V4_-2.5V)</text><text x="860" y="876" font-size="12" fill="#1d3f9a" font-weight="normal">1.20 V (对AVSS)</text><text x="1060" y="876" font-size="12" fill="#222" font-weight="normal">1.15 – 1.25 V</text><text x="1270" y="876" font-size="12" fill="#222" font-weight="normal">[          ] V</text><text x="1480" y="876" font-size="12" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,891 1615,891" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="917" font-size="12" fill="#222" font-weight="normal">07</text><text x="120" y="917" font-size="12" fill="#1d3f9a" font-weight="normal">VREFP 4V 内部基准</text><text x="310" y="917" font-size="12" fill="#222" font-weight="normal">采集板 P8</text><text x="470" y="917" font-size="12" fill="#222" font-weight="normal">V4_C45.2 (U1.24) → V4_C45.1 (V4_-2.5V)</text><text x="860" y="917" font-size="12" fill="#1d3f9a" font-weight="normal">4.00 V (对AVSS)</text><text x="1060" y="917" font-size="12" fill="#222" font-weight="normal">3.92 – 4.08 V</text><text x="1270" y="917" font-size="12" fill="#222" font-weight="normal">[          ] V</text><text x="1480" y="917" font-size="12" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,932 1615,932" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="958" font-size="12" fill="#222" font-weight="normal">08</text><text x="120" y="958" font-size="12" fill="#1d3f9a" font-weight="normal">AFE_CLK_IN 采样主时钟</text><text x="310" y="958" font-size="12" fill="#222" font-weight="normal">采集板 P8</text><text x="470" y="958" font-size="12" fill="#222" font-weight="normal">V4_X1.3 → GND (V4_R18.1)</text><text x="860" y="958" font-size="12" fill="#1d3f9a" font-weight="normal">2.048 MHz 方波</text><text x="1060" y="958" font-size="12" fill="#222" font-weight="normal">2.048 MHz ±100ppm</text><text x="1270" y="958" font-size="12" fill="#222" font-weight="normal">[          ] MHz</text><text x="1480" y="958" font-size="12" fill="#222" font-weight="normal">□ PASS</text><polyline points="55,973 1615,973" fill="none" stroke="#dce1e8" stroke-width="1"/><text x="60" y="999" font-size="12" fill="#222" font-weight="normal">09</text><text x="120" y="999" font-size="12" fill="#1d3f9a" font-weight="normal">USB 互锁关断 (插USB)</text><text x="310" y="999" font-size="12" fill="#222" font-weight="normal">主控板 P3/P5</text><text x="470" y="999" font-size="12" fill="#222" font-weight="normal">插 USB 测 U2.22 (OE_N) → GND</text><text x="860" y="999" font-size="12" fill="#1d3f9a" font-weight="normal">3.30 V (高阻关断)</text><text x="1060" y="999" font-size="12" fill="#222" font-weight="normal">≥ 2.90 V</text><text x="1270" y="999" font-size="12" fill="#222" font-weight="normal">[          ] V</text><text x="1480" y="999" font-size="12" fill="#222" font-weight="normal">□ PASS</text><text x="40" y="1125" font-size="22" fill="#111" text-anchor="start" font-weight="bold">OpenEMG 8 通道单面腕带 · 电源树与离体上电实测表</text><text x="40" y="1155" font-size="12" fill="#555" text-anchor="start" font-weight="normal">VBUS 5V → TP4054 → VBAT → TLV75533 3.3V → 3V3_AFE → LM27762 ±2.5V → ADS1298 U1；含 USB 硬件断电互锁</text><rect x="1180" y="1094" width="470" height="84" fill="none" stroke="#333" stroke-width="1.4"/><polyline points="1180,1122 1650,1122" fill="none" stroke="#333" stroke-width="1"/><polyline points="1180,1150 1650,1150" fill="none" stroke="#333" stroke-width="1"/><polyline points="1260,1094 1260,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1480,1094 1480,1178" fill="none" stroke="#333" stroke-width="1"/><polyline points="1550,1094 1550,1178" fill="none" stroke="#333" stroke-width="1"/><text x="1190" y="1113" font-size="12" fill="#333" text-anchor="start">图名</text><text x="1270" y="1113" font-size="12" fill="#111" text-anchor="start">C08B 8通道腕带 · 电源树</text><text x="1490" y="1113" font-size="12" fill="#333" text-anchor="start">版本</text><text x="1560" y="1113" font-size="12" fill="#111" text-anchor="start">D20-8CH + R4U6</text><text x="1190" y="1141" font-size="12" fill="#333" text-anchor="start">图页</text><text x="1270" y="1141" font-size="12" fill="#111" text-anchor="start">2 / 11</text><text x="1490" y="1141" font-size="12" fill="#333" text-anchor="start">日期</text><text x="1560" y="1141" font-size="12" fill="#111" text-anchor="start">2026-11-15</text><text x="1190" y="1169" font-size="12" fill="#333" text-anchor="start">网表</text><text x="1270" y="1169" font-size="12" fill="#111" text-anchor="start">电源轨与上电实测记录表</text><text x="1490" y="1169" font-size="12" fill="#333" text-anchor="start">尺寸</text><text x="1560" y="1169" font-size="12" fill="#111" text-anchor="start">A3</text></svg>