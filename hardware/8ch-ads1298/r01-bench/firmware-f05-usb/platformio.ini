; F05-USB：USB 串口取代蓝牙的离体台架固件。板包与 F05 同一提交；构建请用 build.py（它会拼进 F05 的 ADS 驱动和豁免锁头文件）。
[platformio]
default_envs = usb_2k_spi2

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoblesense_adafruit
framework = arduino
platform_packages =
    framework-arduinoadafruitnrf52-seeed @ https://github.com/maxgerhardt/framework-arduinoadafruitnrf52-seeed.git#3ae21c3c6c544fed6e949f00986324dd95fb2b89
build_flags =
    -ffp-contract=off
extra_scripts = pre:verify_board.py

[env:usb_2k_spi1]
build_flags = ${env.build_flags} -DMAKO_V12_FS=2000 -DMAKO_V12_SPI_HZ=1000000

; DOUT 代 DRDY 时，读一帧+发送要在 500µs 内完成；1MHz 逐字节读约 450µs 太紧，2MHz 留余量
[env:usb_2k_spi2]
build_flags = ${env.build_flags} -DMAKO_V12_FS=2000 -DMAKO_V12_SPI_HZ=2000000

; 4kSPS：周期 250µs。2MHz 实测读+发最长 272µs、约 4.5s 后停机；4MHz 读帧约 55µs
[env:usb_4k_spi4]
build_flags = ${env.build_flags} -DMAKO_V12_FS=4000 -DMAKO_V12_SPI_HZ=4000000
