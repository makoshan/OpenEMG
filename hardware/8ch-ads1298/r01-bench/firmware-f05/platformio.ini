[platformio]
default_envs = ads_2k

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoblesense_adafruit
framework = arduino
platform_packages =
    framework-arduinoadafruitnrf52-seeed @ https://github.com/maxgerhardt/framework-arduinoadafruitnrf52-seeed.git#3ae21c3c6c544fed6e949f00986324dd95fb2b89
build_flags =
    -ffp-contract=off
    -DMAKO_V12_AFE_ENABLED=0
extra_scripts = pre:verify_board.py

[env:ads_2k]
build_flags = ${env.build_flags} -DMAKO_V12_FS=2000

[env:ads_4k]
build_flags = ${env.build_flags} -DMAKO_V12_FS=4000

; 只改变SPI速度，硬件锁与采样率不变；默认ads_2k/ads_4k仍为2MHz。
[env:ads_2k_spi1]
build_flags = ${env:ads_2k.build_flags} -DMAKO_V12_SPI_HZ=1000000

[env:ads_2k_spi4]
build_flags = ${env:ads_2k.build_flags} -DMAKO_V12_SPI_HZ=4000000

[env:ads_2k_spi8]
build_flags = ${env:ads_2k.build_flags} -DMAKO_V12_SPI_HZ=8000000

[env:ads_4k_spi1]
build_flags = ${env:ads_4k.build_flags} -DMAKO_V12_SPI_HZ=1000000

[env:ads_4k_spi4]
build_flags = ${env:ads_4k.build_flags} -DMAKO_V12_SPI_HZ=4000000

[env:ads_4k_spi8]
build_flags = ${env:ads_4k.build_flags} -DMAKO_V12_SPI_HZ=8000000

; IMU独立TWIM1/INT1实验候选，默认8档仍不启用IMU；不改变AFE锁。
[env:ads_2k_imu]
build_flags = ${env:ads_2k.build_flags} -DMAKO_V12_IMU_ENABLED=1

[env:ads_4k_imu]
build_flags = ${env:ads_4k.build_flags} -DMAKO_V12_IMU_ENABLED=1
