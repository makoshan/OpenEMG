; 阶段3只开电源固件：与F05同一板包版本，但不含SPI/BLE/采样，不参与F05解锁。
[platformio]
default_envs = power_only

[env:power_only]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoblesense_adafruit
framework = arduino
platform_packages =
    framework-arduinoadafruitnrf52-seeed @ https://github.com/maxgerhardt/framework-arduinoadafruitnrf52-seeed.git#3ae21c3c6c544fed6e949f00986324dd95fb2b89
build_flags = -DP03_HOLD_MS=10000 -DP03_ARM_MS=3000
extra_scripts = pre:verify_board.py

; 万用表验收版：PWDN→复位等5s（蓝灯常亮，这段读TP8）、复位后保持30s（绿灯，这段量TP1/TP2/TP3/TP4）。
[env:power_only_long]
platform = ${env:power_only.platform}
board = ${env:power_only.board}
framework = arduino
platform_packages = ${env:power_only.platform_packages}
build_flags = -DP03_HOLD_MS=30000 -DP03_ARM_MS=3000 -DP03_POR_US=5000000u
extra_scripts = pre:verify_board.py
