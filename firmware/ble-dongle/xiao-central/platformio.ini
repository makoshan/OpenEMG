; 蓝牙接收器：XIAO nRF52840 当中心，连 MAKO-CH585-TPUT，通知原样经 USB CDC 转给 Mac。
; 平台、板包、Bluefruit 断连补丁与 F05 / xiao-synth 一致（复用 verify_board.py）。
[platformio]
default_envs = dongle

[env:dongle]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoblesense_adafruit
framework = arduino
platform_packages =
    framework-arduinoadafruitnrf52-seeed @ https://github.com/maxgerhardt/framework-arduinoadafruitnrf52-seeed.git#3ae21c3c6c544fed6e949f00986324dd95fb2b89
; MAKO_V12_FS=0 只为满足 verify_board.py 的构建 ID 计算，接收器不产样本
build_flags =
    -ffp-contract=off
    -I../../../hardware/8ch-ads1298/r01-bench/firmware-f05/src
    -DMAKO_V12_FS=0
extra_scripts = pre:../../../hardware/8ch-ads1298/r01-bench/firmware-f05/verify_board.py
; R01 也是 XIAO Sense（VID/PID 同为 0x2886/0x8045），主机只能靠 USB 产品名区分接收器
board_build.usb_product = MAKO-DONGLE

; 4k 瓶颈实验档：中心事件长度 7.5 ms / 关事件扩展（判断中心是不是限速方）
[env:dongle_evt6]
extends = env:dongle
build_flags = ${env:dongle.build_flags} -DDONGLE_EVT_LEN=6

[env:dongle_noext]
extends = env:dongle
build_flags = ${env:dongle.build_flags} -DDONGLE_NO_EXT

; 阳性对照：事件长度 2.5 ms 且不扩展，中心若真按它收事件，每事件包数应明显下降
[env:dongle_evt2_noext]
extends = env:dongle
build_flags = ${env:dongle.build_flags} -DDONGLE_EVT_LEN=2 -DDONGLE_NO_EXT

; 接 R01 离体板（firmware-f05-ble-dout，广播名 MAKO-V12-ADS-2K）：Mac 直连 30 ms 丢 3.5–13%，接收器定 7.5 ms
[env:dongle_r01]
extends = env:dongle
build_flags = ${env:dongle.build_flags} -DDONGLE_TARGET=\"MAKO-V12-ADS-2K\" -DDONGLE_PEER_MTU

; 接 ADS1292 两路板 + P44e + XIAO（xiao-ads1292-2ch）：外设开采时主动发起 MTU 247，开启 DONGLE_PEER_MTU 防撞
[env:dongle_1292_2k]
extends = env:dongle
build_flags = ${env:dongle.build_flags} -DDONGLE_TARGET=\"MAKO-V12-1292-2K\" -DDONGLE_PEER_MTU

[env:dongle_1292_4k]
extends = env:dongle
build_flags = ${env:dongle.build_flags} -DDONGLE_TARGET=\"MAKO-V12-1292-4K\" -DDONGLE_PEER_MTU

; 连接间隔扫描（../../ble-probe/sweep.py）：连 xiao-synth 的 synth_4k_* 档；它没有状态和控制特征，MTU 由它发起
[env:dongle_synth4k]
extends = env:dongle
build_flags = ${env:dongle.build_flags} -DDONGLE_TARGET=\"MAKO-SYNTH-4K\" -DDONGLE_PEER_MTU -DDONGLE_NO_CTRL
