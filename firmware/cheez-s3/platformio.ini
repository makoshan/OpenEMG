; 单通道台架：Cheez sEMG-D 模块 + ESP32-S3 DevKitC-1 仿板（N16R8）。
; 2026-10-16 从 tiny-ai-watchfirmware/ 迁来，src/emg_usb.cpp 与旧仓 56c43d8 逐字节相同。
; 接线：模块 V→5V、G→GND、S→1k→GPIO4（ADC1）、L→GPIO5。USB 插标 COM 的口（CH340，VID 0x1A86）：
; 这块板只有 COM 口给排针 5V 供电，且要先桥正面 IN-OUT 焊盘。串口是走 CH340 的 UART0。
; 刷机：pio run -d firmware/cheez-s3 -e emg_usb_s3 -t upload（没有 UF2，也没有 'u' 命令）。
[platformio]
default_envs = emg_usb_s3

[env:emg_usb_s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0 -DMAKO_EMG_PIN=4 -DMAKO_EMG_WEAR_PIN=5
