[platformio]
default_envs = ads1292_2k

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoblesense_adafruit
framework = arduino
platform_packages =
    framework-arduinoadafruitnrf52-seeed @ https://github.com/maxgerhardt/framework-arduinoadafruitnrf52-seeed.git#3ae21c3c6c544fed6e949f00986324dd95fb2b89
; TI SBAS502C §7.6：内部 512 kHz 时钟下寄存器读写 f_SCLK <= 2*f_CLK = 1.024 MHz，固定锁死 1 MHz。
build_flags =
    -ffp-contract=off
    -DMAKO_V12_AFE_ENABLED=0
    -DMAKO_V12_SPI_HZ=1000000
extra_scripts = pre:verify_board.py

[env:ads1292_2k]
build_flags = ${env.build_flags} -DMAKO_V12_FS=2000

[env:ads1292_4k]
build_flags = ${env.build_flags} -DMAKO_V12_FS=4000
